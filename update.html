<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Update Level III Basic</title>
<style>
body{margin:0;background:#0b1020;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:grid;place-items:center}
.card{max-width:520px;margin:24px;padding:24px;border-radius:18px;background:#151c2f;border:1px solid #334155;text-align:center}
h1{font-size:26px}p{color:#cbd5e1;line-height:1.5}.ok{color:#6ee7b7;font-weight:800}
</style></head>
<body><div class="card"><h1>Updating L3 Basic</h1><p id="msg">Removing the old cached app files. Your quiz progress, bookmarks, and study history are not being erased.</p></div>
<script>
(async()=>{
  try{
    const regs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r=>r.unregister()));
    const keys=await caches.keys();
    await Promise.all(keys.map(k=>caches.delete(k)));
    document.getElementById('msg').innerHTML='<span class="ok">Update cache cleared.</span><br>Loading Version 2C…';
    setTimeout(()=>location.replace('./?v=2c&fresh='+Date.now()),700);
  }catch(e){
    document.getElementById('msg').textContent='Could not complete the automatic refresh. Close this page and try again.';
  }
})();
</script></body></html>
