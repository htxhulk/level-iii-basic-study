s 2.5.2.3 Applications 2.5.2.3.1 Welds 2.5.2.3.2 Castings 2.5.2.3.3 Wrought metals 2.5.2.3.4 Machined parts 2.5.2.3.5 Field applications REFERENCES ASNT, 2008, Nondestructive Testing Handbook, Vol. 8: Magnetic Particle Testing, third edition, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Level II Study Guide: Magnetic Particle Testing Method, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Level III Study Guide: Magnetic Particle Testing Method, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Questions & Answers Book: Magnetic Particle Testing Method, American Society for Nondestructive Testing, Columbus, OH. ASNT, 2015, Magnetic Particle Testing Classroom Training Book, PTP Series, American Society for Nondestructive Testing, Columbus, OH. MT Review Questions"},"answer":"b","section":"II","category":"Magnetic Flux Leakage Testing","id":192},{"number":1,"question":"Which of the following materials is considered nonferrous?","options":{"a":"Copper alloys","b":"High alloy steels","c":"Tool steels","d":"Ferritic stainless steels"},"answer":"a","section":"II","category":"Magnetic Particle Testing","id":193},{"number":2,"question":"Materials that are strongly attracted to a magnet are called:","options":{"a":"magnetized.","b":"nonmagnetic.","c":"ferromagnetic.","d":"magnetic."},"answer":"c","section":"II","category":"Magnetic Particle Testing","id":194},{"number":3,"question":"Magnetic lines of force (magnetic fields) are oriented in what direction in relation to the direction of the magnetizing current?","options":{"a":"Parallel","b":"At right angles","c":"At a 45° angle","d":"At random angles"},"answer":"b","section":"II","category":"Magnetic Particle Testing","id":195},{"number":4,"question":"“Magnetizing flux” relates to:","options":{"a":"the direction of current flow in an electromagnet.","b":"the manner by which magnetism flows through space.","c":"the lines of force associated with a magnetic field.","d":"permanent magnets only."},"answer":"c","section":"II","category":"Magnetic Particle Testing","id":196},{"number":5,"question":"What does subjecting a part to a magnetic field that is constantly reversing in polarity and gradually diminishing in strength accomplish?","options":{"a":"Demagnetizes the part.","b":"Magnetizes the part.","c":"Increases the residual magnetism.","d":"Locates deep-lying discontinuities."},"answer":"a","section":"II","category":"Magnetic Particle Testing","id":197},{"number":6,"question":"What is circular magnetization used to detect?","options":{"a":"Circumferential cracks","b":"Longitudinal cracks","c":"Cracks in cylindrical parts at right angles to the long axis of the part","d":"Deep-lying discontinuities"},"answer":"b","section":"II","category":"Magnetic Particle Testing","id":198},{"number":7,"question":"In which magnetizing method is the current passed directly through the part, thereby setting up a magnetic field at right angles to the current flow?","options":{"a":"Longitudinal magnetization","b":"Coil magnetization","c":"Central conductor magnetization","d":"Circular magnetization"},"answer":"d","section":"II","category":"Magnetic Particle Testing","id":199},{"number":8,"question":"Which of the following is a major disadvantage of using prods?","options":{"a":"The magnetic field may be applied in the wrong direction.","b":"The inspection surface may be arc burned.","c":"Magnetic saturation may occur.","d":"Control of the amperage."},"answer":"b","section":"II","category":"Magnetic Particle Testing","id":200},{"number":9,"question":"What is it called when wet magnetic particles are applied to a part while the current is flowing?","options":{"a":"Continuous method","b":"Dry method","c":"Residual method","d":"Demagnetization method"},"answer":"a","section":"II","category":"Magnetic Particle Testing","id":201},{"number":10,"question":"How is the inside diameter of a cylinder best urface","b":"A longitudinal crack","c":"Reversal of the magnetic field","d":"Hysteresis"},"answer":"b","section":"II","category":"Magnetic Particle Testing","id":207},{"number":16,"question":"MT techniques are recognized as superior to liquid penetrant testing techniques when:","options":{"a":"the surfaces of the test object are corroded.","b":"the surface is anodized.","c":"the parts are painted.","d":"the part is made from austenitic steel."},"answer":"c","section":"II","category":"Magnetic Particle Testing","id":208},{"number":17,"question":"When using direct current, an indication is detected. What is the next logical step to determine if the indication results from a surface or subsurface condition?","options":{"a":"Reinspect using the surge method.","b":"Demagnetize and apply powder.","c":"Reinspect at higher amperage.","d":"Reinspect using alternating current."},"answer":"d","section":"II","category":"Magnetic Particle Testing","id":209},{"number":18,"question":"What should a requirement to use MT on a part include?","options":{"a":"A fabrication and service manual.","b":"A statement on the drawing that requires MT.","c":"The procedure to be used and acceptance criteria.","d":"The method of test and service conditions."},"answer":"c","section":"II","category":"Magnetic Particle Testing","id":210},{"number":19,"question":"Which of the following magnetization techniques are NOT used for MFL?","options":{"a":"AC magnetization","b":"DC magnetization","c":"Permanent-magnet magnetization","d":"Eddy current magnetization"},"answer":"a","section":"II","category":"Magnetic Particle Testing","id":211},{"number":20,"question":"What is the major advantage of using a Hall effect sensor over a coil?","options":{"a":"Its element is very thin, flexible, and rugged.","b":"It requires no support or protection in industrial NDT applications.","c":"It does not require movement to detect and evaluate a leakage field.","d":"Its element is thick and rugged for continuous movement without breaking."},"answer":"b","section":"II","category":"Magnetic Particle Testing","id":212},{"number":21,"question":"In MFL, the presence of a discontinuity results in:","options":{"a":"a local decrease in magnetic flux density.","b":"a local increase in magnetic flux density.","c":"a local increase in permeability.","d":"no variation to permeability and magnetic flux density. Magnetic Particle Testing Topical Outline 2.5 Magnetic Particle Testing (MT) 2.5.1 Fundamentals 2.5.1.1 Magnetic field principles 2.5.1.2 Magnetization by means of electric current 2.5.1.3 Demagnetization 2.5.2 MT 2.5.2.1 Basic types of equipment and inspection materials 2.5.2.2 Test results interpretation, discontinuity indications 2.5.2.3 Applications 2.5.2.3.1 Welds 2.5.2.3.2 Castings 2.5.2.3.3 Wrought metals 2.5.2.3.4 Machined parts 2.5.2.3.5 Field applications REFERENCES ASNT, 2008, Nondestructive Testing Handbook, Vol. 8: Magnetic Particle Testing, third edition, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Level II Study Guide: Magnetic Particle Testing Method, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Level III Study Guide: Magnetic Particle Testing Method, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Questions & Answers Book: Magnetic Particle Testing Method, American Society for Nondestructive Testing, Columbus, OH. ASNT, 2015, Magnetic Particle Testing Classroom Training Book, PTP Series, American Society for Nondestructive Testing, Columbus, OH. MT Review Questions"},"answer":"a","section":"II","category":"Magnetic Particle Testing","id":213},{"number":22,"question":"For maximum sensitivity in MT of rough welds, what is the recommended initial surface preparation?","options":{"a":"Wire brush the weld to remove slag and scale.","b":"Use standard test weldments for comparison.","c":"Coat the weld bead with lacquer.","d":"Grind the weld bead to remove all surface irregularities."},"answer":"a","section":"II","category":"Magnetic Particle Testing","id":214},{"number":23,"question":"Ferromagnetic materials are made up of small, polarized regions known as:","options":{"a":"photons.","b":"quarks.","c":"electrons.","d":"domains."},"answer":"d","section":"II","category":"Magnetic Particle Testing","id":215},{"number":24,"question":"The reapplication of magnetic particle suspension after current has already been applied to a part is known as the:","options":{"a":"residual method.","b":"continuous method.","c":"magnetization method.","d":"demagnetization method."},"answer":"a","section":"II","category":"Magnetic Particle Testing","id":216},{"number":25,"question":"Subsurface indications will have the appearance of:","options":{"a":"well-defined lines.","b":"fuzzy-looking lines.","c":"bright, solid lines.","d":"intermittent lines."},"answer":"b","section":"II","category":"Magnetic Particle Testing","id":217},{"number":26,"question":"What are the locations on a magnetized part called where the magnetic field lines either enter or exit the part?","options":{"a":"Defects","b":"Salient points","c":"Magnetic poles","d":"Nodes"},"answer":"c","section":"II","category":"Magnetic Particle Testing","id":218},{"number":27,"question":"What is the strength of a magnetic field induced in a part is often called?","options":{"a":"Retentivity","b":"Current density","c":"Voltage","d":"Flux density"},"answer":"d","section":"II","category":"Magnetic Particle Testing","id":219},{"number":28,"question":"When inspecting steel components that have been exposed to atmospheric conditions for an extended period of time, what is an advantage of MT over PT?","options":{"a":"MT does not require a power source.","b":"Heavy rust formations do not have to be removed.","c":"MT will detect oxide-filled cracks.","d":"MT does not require removal of weld slag."},"answer":"c","section":"II","category":"Magnetic Particle Testing","id":220},{"number":29,"question":"When performing wet MT outdoors or in a brightly lit environment, which action will best improve the visibility and contrast of magnetic particle indications?","options":{"a":"Use fluorescent particle sprays.","b":"Use a high-intensity light source.","c":"Lightly spray the subject area with a dusting of flat white paint.","d":"Shield the area from sunlight."},"answer":"d","section":"II","category":"Magnetic Particle Testing","id":221},{"number":1,"question":"The highest intensity sources of thermal neutrons are:","options":{"a":"Cf-252 isotopes.","b":"accelerators.","c":"nuclear fission reactors.","d":"cosmic radiation."},"answer":"c","section":"II","category":"Neutron Radiography","id":222},{"number":2,"question":"Neutrons for fast-neutron radiography are obtainable from:","options":{"a":"accelerators.","b":"Co-60 or Ir-192.","c":"moderated neutrons from reactors.","d":"X-ray machines."},"answer":"a","section":"II","category":"Neutron Radiography","id":223},{"number":3,"question":"A radioactive source used for NR is:","options":{"a":"californium-252 (Cf-252).","b":"plutonium-239 (Pu-239).","c":"cobalt-60 (Co-60).","d":"cesium-137 (Cs-137)."},"answer":"a","section":"II","category":"Neutron Radiography","id":224},{"number":4,"question":"The energy of the neutron is expressed in which of the following units of measurement?","options":{"a":"Becquerels (Curies)","b":"Coulombs per kilogram (Röntgen)","c":"Sieverts (rem)","d":"Electronvolts"},"answer":"d","section":"II","category":"Neutron Radiography","id":225},{"number":5,"question":"What is the most important desirable feature of a thermal neutron beam for NR?","options":{"a":"background gamma radiation intensity.","b":"relatively high thermal neutron intensity.","c":"low angular divergence.","d":"relatively high thermal neutron intensity."},"answer":"b","section":"II","category":"Neutron Radiography","id":226},{"number":6,"question":"A material that slows down neutrons is called:","options":{"a":"a moderator.","b":"an accumulator.","c":"a limitor.","d":"a collimator."},"answer":"a","section":"II","category":"Neutron Radiography","id":227},{"number":7,"question":"The primary radiation mechanism for darkening radiographic film when the direct NR process is used with gadolinium screens is:","options":{"a":"alpha particles.","b":"electrons.","c":"gamma rays.","d":"light emission."},"answer":"b","section":"II","category":"Neutron Radiography","id":228},{"number":8,"question":"NR using the transfer method requires that the imaging screen must:","options":{"a":"be placed behind the film.","b":"be placed in front of the film.","c":"be very thin.","d":"become radioactive."},"answer":"d","section":"II","category":"Neutron Radiography","id":229},{"number":9,"question":"Which of the following NR converter foils CANNOT be used for transfer or indirect radiography?","options":{"a":"Dysprosium","b":"Indium","c":"Gadolinium","d":"Gold"},"answer":"c","section":"II","category":"Neutron Radiography","id":230},{"number":10,"question":"The most suitable films for producing neutron radiographs are:","options":{"a":"industrial X-ray films.","b":"red-sensitive films.","c":"instant-type films.","d":"emulsions that contain no silver halides."},"answer":"a","section":"II","category":"Neutron Radiography","id":231},{"number":11,"question":"Materials that are exposed to thermal neutron beams:","options":{"a":"must not be handled for at least 3 min after exposure has ceased.","b":"must be stored in a lead-lined room.","c":"should be monitored by means of a neutron counter.","d":"may be radioactive after exposure to neutrons has ceased."},"answer":"d","section":"II","category":"Neutron Radiography","id":232},{"number":12,"question":"Lead is:","options":{"a":"a good neutron shield.","b":"corroded by neutron exposures.","c":"a relatively poor neutron absorber.","d":"an efficient conversion screen."},"answer":"c","section":"II","category":"Neutron Radiography","id":233},{"number":13,"question":"If 2 mm (0.08 in.) of plastic attenuates a thermal neutron beam by a factor of 2, then 20 mm (0.8 in.) will attenuate it by approximately a factor of:","options":{"a":"10","b":"20","c":"200","d":"1000"},"answer":"d","section":"II","category":"Neutron Radiography","id":234},{"number":14,"question":"Commonly used materials for moderating fast-neutron sources include:","options":{"a":"aluminum, magnesium, and tin.","b":"water, plastic, paraffin, and graphite.","c":"neon, argon, and xenon.","d":"tungsten, cesium, antimony, and columbium."},"answer":"b","section":"II","category":"Neutron Radiography","id":235},{"number":15,"question":"The main reason for using NR in place of X-radiography is:","options":{"a":"a lower cost.","b":"higher resolution.","c":"the ability to image objects and materials not possible with X-rays.","d":"a simpler radiographic procedure when required than X-radiography."},"answer":"c","section":"II","category":"Neutron Radiography","id":236},{"number":16,"question":"A photographic record produced by the passage of neutrons through a specimen onto a film is called:","options":{"a":"a fluoroscopic image.","b":"an isotopic reproduction.","c":"a radiograph.","d":"a track-etch photograph."},"answer":"c","section":"II","category":"Neutron Radiography","id":237},{"number":17,"question":"Many of the absorption differences between neutrons and X-rays indicate that the two techniques:","options":{"a":"cause radiation problems.","b":"complement each other.","c":"can be used interchangeably.","d":"are equally effective for imaging hydrogenous materials."},"answer":"b","section":"II","category":"Neutron Radiography","id":238},{"number":18,"question":"The penetrating ability of a thermal neutron beam is governed by:","options":{"a":"attenuating characteristics of the material being penetrated.","b":"exposure time.","c":"source-to-film distance.","d":"thickness of the converter screen."},"answer":"a","section":"II","category":"Neutron Radiography","id":239},{"number":19,"question":"The transfer exposure method is used because:","options":{"a":"it is not influenced by gamma radiation in the primary beam.","b":"it produces greater radiographic sensitivity than direct exposure using gadolinium.","c":"it is faster than the direct exposure method.","d":"the screens used in this method emit only internal conversion electrons of about 70 keV."},"answer":"a","section":"II","category":"Neutron Radiography","id":240},{"number":20,"question":"Higher resolution can be achieved in direct NR by:","options":{"a":"placing a lead intensifying screen between a gadolinium screen and the film.","b":"increasing the length-to-diameter ratio of the collimation system.","c":"increasing the exposure time.","d":"increasing the distance between the object and the film cassette."},"answer":"b","section":"II","category":"Neutron Radiography","id":241},{"number":21,"question":"The primary advantage of using a Cf-252 source for NR is its:","options":{"a":"portability.","b":"low cost per unit neutron flux compared to other neutron radiographic sources.","c":"high resolution.","d":"long useful life."},"answer":"a","section":"II","category":"Neutron Radiography","id":242},{"number":22,"question":"The quality of results from a neutron radiographic exposure is best determined by:","options":{"a":"reference standards.","b":"image quality indicators.","c":"neutron flux measurement.","d":"densitometer readings."},"answer":"b","section":"II","category":"Neutron Radiography","id":243},{"number":23,"question":"Apparent discontinuities in the imaging screen (rather than in the test part) can be ruled out by:","options":{"a":"comparing a neutron radiograph of the parts to a blank neutron radiograph of the same imaging screen with no parts in place.","b":"producing a photographic copy of the original neutron radiograph using X-ray duplicating film.","c":"increasing the exposure time of the radiograph.","d":"decreasing the temperature of the developer solution."},"answer":"a","section":"II","category":"Neutron Radiography","id":244},{"number":24,"question":"For inspection of radioactive objects or those that emit gamma radiation when bombarded with neutrons, a preferable detection technique is the:","options":{"a":"direct exposure technique.","b":"transfer technique.","c":"isotopic reproduction technique.","d":"electrostatic-belt generator technique."},"answer":"b","section":"II","category":"Neutron Radiography","id":245},{"number":25,"question":"NR is an excellent tool for determining:","options":{"a":"the coating thickness of aluminum oxide on anodized aluminum.","b":"the size of voids in thick steel castings.","c":"the integrity of thin plastic material within a steel housing.","d":"tungsten inclusions in gas tungsten arc welding welds."},"answer":"c","section":"II","category":"Neutron Radiography","id":246},{"number":26,"question":"NR extends radiographic capability for detecting cracks in small cylinders of:","options":{"a":"aluminum.","b":"iron.","c":"magnesium.","d":"plutonium."},"answer":"d","section":"II","category":"Neutron Radiography","id":247},{"number":27,"question":"Which of the following is a preferred application of NR?","options":{"a":"Detecting tungsten inclusions in titanium ingots.","b":"Detecting the presence of water in the cells of stainless steel honeycomb.","c":"Detecting slag inclusions in structural steel welds.","d":"Determining the depth of seating of a projectile in a metallic case."},"answer":"b","section":"II","category":"Neutron Radiography","id":248},{"number":28,"question":"Common sources of neutrons for NR are:","options":{"a":"electron linear accelerators.","b":"isotopes of cobalt (e.g., Co-60).","c":"nuclear reactors.","d":"betatrons."},"answer":"c","section":"II","category":"Neutron Radiography","id":249},{"number":29,"question":"When inspecting explosive or pyrotechnic devices using NR, what is one principal advantage?","options":{"a":"Clear imaging of metallic components without needing a high-energy X-ray beam.","b":"The ability to visualize nonmetallic explosive fill or internal pyrotechnic material behind metallic casings.","c":"A reduced need for radiation shielding due to the fast-neutron flux.","d":"The simplicity of performing this technique with minimal safety precautions."},"answer":"b","section":"II","category":"Neutron Radiography","id":250},{"number":30,"question":"Radiographic detection of small amounts of explosive in thick steel will give the best contrast if what kind of neutrons are used?","options":{"a":"Cold","b":"Thermal","c":"Epithermal","d":"Fast"},"answer":"a","section":"II","category":"Neutron Radiography","id":251},{"number":1,"question":"The penetrating ability of an X-ray beam is governed by:","options":{"a":"kilovoltage or wavelength (energy).","b":"time.","c":"milliamperage.","d":"source-to-film distance."},"answer":"a","section":"II","category":"Radiographic Testing","id":252},{"number":2,"question":"If two X-ray machines are set to the same kilovoltage and milliamperage, which of the following is true about the radiation they produce?","options":{"a":"They will always produce the same intensity and energy of radiation.","b":"They will produce the same intensity, but the energy of the radiation may differ.","c":"They will produce the same energy, but the intensity of the radiation may differ.","d":"They may produce different intensities and different energies of radiation."},"answer":"d","section":"II","category":"Radiographic Testing","id":253},{"number":3,"question":"Short wavelength electromagnetic radiation produced during the disintegration of nuclei of radioactive substances is called:","options":{"a":"X-radiation.","b":"gamma radiation.","c":"scatter radiation.","d":"beta radiation."},"answer":"b","section":"II","category":"Radiographic Testing","id":254},{"number":4,"question":"Almost all gamma radiography is performed with:","options":{"a":"natural isotopes.","b":"artificially produced isotopes.","c":"radium.","d":"Co-60."},"answer":"b","section":"II","category":"Radiographic Testing","id":255},{"number":5,"question":"The energy of gamma rays is expressed by which of the following units of measurement?","options":{"a":"Gigabecquerel (Curie)","b":"Coulomb per kilogram (Röntgen)","c":"Half-life","d":"Kiloelectronvolts (keV) or megaelectronvolts (MeV)"},"answer":"d","section":"II","category":"Radiographic Testing","id":256},{"number":6,"question":"Of the following, the source providing the most penetrating radiation is:","options":{"a":"Co-60.","b":"220 kVp X-ray tube.","c":"15 MeV betatron.","d":"electrons from Ir-192."},"answer":"c","section":"II","category":"Radiographic Testing","id":257},{"number":7,"question":"The difference between the densities of two areas of a radiograph is called:","options":{"a":"radiographic contrast.","b":"subject contrast.","c":"film contrast.","d":"definition."},"answer":"a","section":"II","category":"Radiographic Testing","id":258},{"number":8,"question":"The fact that gases, when bombarded by radiation, ionize and become electrical conductors makes them useful in:","options":{"a":"X-ray transformers.","b":"fluoroscopes.","c":"masks.","d":"radiation-detection equipment."},"answer":"d","section":"II","category":"Radiographic Testing","id":259},{"number":9,"question":"Why must the exposure time be increased by a factor of four when the source-to-film distance is doubled in radiography?","options":{"a":"Because the intensity of radiation decreases at an exponential as the distance increases.","b":"Because the energy of radiation is inversely proportional to the square root of the distance from the source to the film.","c":"Because the intensity of radiation is inversely proportional to the square of the distance from the source to the film.","d":"Because the effect of scattered radiation increases as the source-to-film distance increases."},"answer":"c","section":"II","category":"Radiographic Testing","id":260},{"number":10,"question":"The most important factor in X-ray absorption of a specimen is:","options":{"a":"the thickness of the specimen.","b":"the density of the specimen.","c":"Young’s modulus of the material.","d":"the atomic number of the material."},"answer":"d","section":"II","category":"Radiographic Testing","id":261},{"number":11,"question":"The maximum permissible dose per calendar year is 0.05 Sv (5 rem) for:","options":{"a":"extremities.","b":"skin.","c":"whole body (total effective dose equivalent).","d":"a fetus from occupational exposure of a declared pregnant woman."},"answer":"c","section":"II","category":"Radiographic Testing","id":262},{"number":12,"question":"Exposure to small doses of X-rays or gamma rays:","options":{"a":"has a cumulative effect that must be considered when monitoring for maximum permissible dose.","b":"is beneficial because it serves to build an immunity in humans to radiation poisoning.","c":"will have no effect on human beings.","d":"will have only a short-term effect on human tissues."},"answer":"a","section":"II","category":"Radiographic Testing","id":263},{"number":13,"question":"Which of the following technique variables is most commonly used to adjust subject contrast?","options":{"a":"Source-to-film distance","b":"Milliamperage","c":"Kilovoltage","d":"Focal spot size"},"answer":"c","section":"II","category":"Radiographic Testing","id":264},{"number":14,"question":"What is the basic difference between a radiograph and a fluoroscopic image?","options":{"a":"The fluoroscopic image is more sensitive.","b":"The fluoroscopic image is positive whereas the radiographic image is negative.","c":"The fluoroscopic image is brighter.","d":"There is no basic difference between the two."},"answer":"b","section":"II","category":"Radiographic Testing","id":265},{"number":15,"question":"Thin sheets of lead foil in intimate contact with X-ray film during exposure increase film density because they:","options":{"a":"fluoresce and emit visible light, which helps expose the film.","b":"absorb the scattered radiation.","c":"prevent backscattered radiation from fogging the film.","d":"emit electrons when exposed to X- and gamma radiation, which helps to darken the film."},"answer":"d","section":"II","category":"Radiographic Testing","id":266},{"number":16,"question":"When viewing a radiograph, an image of the back of the cassette superimposed on the image of the specimen is noted. What is this most likely due to?","options":{"a":"Undercut","b":"Overexposure","c":"X-ray intensity being too high","d":"Backscatter radiation"},"answer":"d","section":"II","category":"Radiographic Testing","id":267},{"number":17,"question":"What is an image quality indicator (IQI) used to measure?","options":{"a":"The size of discontinuities in a part","b":"The density of the film","c":"The quality of the radiographic technique","d":"The amount of radiation that penetrates the test object"},"answer":"c","section":"II","category":"Radiographic Testing","id":268},{"number":18,"question":"In film radiography, where are IQIs typically placed to ensure accurate assessment of image quality?","options":{"a":"Between the intensifying screen and the film","b":"On the source side of the test object","c":"On the film side of the test object","d":"Between the operator and the radiation source"},"answer":"b","section":"II","category":"Radiographic Testing","id":269},{"number":19,"question":"At voltages above 400 kV, the use of lead to provide protection may present serious structural problems. If this should be the case, which of the following materials would most likely be used as a substitute?","options":{"a":"Concrete","b":"Aluminum","c":"Steel","d":"Boron"},"answer":"a","section":"II","category":"Radiographic Testing","id":270},{"number":20,"question":"A distinctive characteristic of megavolt radiography is that it:","options":{"a":"results in comparatively high subject contrast.","b":"results in comparatively high radiographic contrast.","c":"is applicable to comparatively thick or highly absorbing specimens.","d":"is used for stainless steels only."},"answer":"c","section":"II","category":"Radiographic Testing","id":271},{"number":21,"question":"Given the radiographic equivalency factors of 1.4 for InconelTM and 1.0 for 304 stainless steel, what is the approximate equivalent thickness of InconelTM to produce the same exposure as a 3.8 mm (0.15 in.) thickness of 304 stainless steel?","options":{"a":"3 mm (0.12 in.)","b":"9 mm (0.35 in.)","c":"18 mm (0.7 in.)","d":"36 mm (1.4 in.)"},"answer":"a","section":"II","category":"Radiographic Testing","id":272},{"number":22,"question":"The fact that each solid crystalline substance produces its own characteristic X-ray pattern is the basis for:","options":{"a":"xeroradiography.","b":"X-ray diffraction testing.","c":"fluoroscopic testing.","d":"polymorphic testing."},"answer":"b","section":"II","category":"Radiographic Testing","id":273},{"number":23,"question":"When inspecting a light metal casting by fluoroscopy, which of the following discontinuities would most likely be detected?","options":{"a":"Copper shrinkage","b":"Microshrinkage","c":"Shrinkage","d":"Fine cracks"},"answer":"c","section":"II","category":"Radiographic Testing","id":274},{"number":24,"question":"For testing a 25 mm (1 in.) steel plate 305 mm (12 in.) square for laminar discontinuities, which of the following would be most effective?","options":{"a":"3.7 TBq (100 Ci) of Ir-192","b":"925 GBq (25 Ci) of Co-60","c":"250 kVp X-ray machine","d":"An ultrasonic device"},"answer":"d","section":"II","category":"Radiographic Testing","id":275},{"number":25,"question":"A critical weld was made with a double vee-groove. Among those listed, which radiographic technique would provide coverage with the greatest probability for detecting the most serious discontinuities?","options":{"a":"A single exposure centered on the weld and perpendicular to the principal surface of the plate.","b":"Two exposures aligned with the vee-groove, focus ±30° off perpendicular.","c":"Two exposures, perpendicular to the plate, offset by the width of the weld bead.","d":"A single exposure centered on the weld with two films aligned ±30° off perpendicular to the principal surface of the plate."},"answer":"b","section":"II","category":"Radiographic Testing","id":276},{"number":26,"question":"A fuse assembly is radiographed so that measurements can be made on the film to determine a minimum internal clearance dimension. What should be factored into the dimension taken from the film?","options":{"a":"Projection magnification.","b":"Film latitude.","c":"Slope of the characteristic curve.","d":"IQI alignment."},"answer":"a","section":"II","category":"Radiographic Testing","id":277},{"number":27,"question":"Miniature electronic components are to be radiographically inspected to reveal broken copper wire leads of 0.008 in. (0.2 mm) diameter. Which of the following IQIs would be most effective to use in establishing a reliable technique?","options":{"a":"A series of steel plaque-type IQIs ranging in thickness from 0.1 mm (0.005 in.) to 0.4 mm (0.015 in.), containing 1T, 2T, and 4T holes.","b":"A plastic block with the radiographic thickness equivalent of the test objects, containing precision- drilled holes ranging from 0.1 mm (0.005 in.) to 0.4 mm (0.015 in.) diameter.","c":"A plastic block with the radiographic thickness equivalent of the test objects, containing copper wires ranging from 0.1 mm (0.005 in.) to 0.4 mm (0.015 in.) diameter.","d":"A series of copper shims ranging in thickness from 0.1 mm (0.005 in.) to 0.4 mm (0.015 in.), containing 1/2T and 1T holes. Thermal/Infrared Testing Topical Outline 2.8 Thermal/Infrared Testing (IR) 2.8.1 Fundamentals 2.8.1.1 Principles and theory of IR 2.8.1.2 Temperature measurement principles 2.8.1.3 Proper selection of IR technique 2.8.2 Equipment/materials 2.8.2.1 Temperature measurement equipment 2.8.2.2 Heat flux indicators 2.8.2.3 Noncontact devices 2.8.2.4 Contact temperature indicators 2.8.2.5 Noncontact pyrometers 2.8.2.6 Line scanners 2.8.2.7 Thermal imaging 2.8.3 Applications 2.8.3.1 Exothermic or endothermic investigations 2.8.3.2 Friction investigations 2.8.3.3 Fluid flow investigations 2.8.3.4 Thermal resistance investigations 2.8.3.5 Thermal capacitance investigations 2.8.4 Interpretation and evaluation REFERENCES ASNT, 2024, Nondestructive Testing Handbook: Vol. 4: Thermal and Infrared Testing, fourth edition, American Society for Nondestructive Testing, Columbus, OH. ASNT, 2001, Nondestructive Testing Handbook, Vol. 3: Infrared and Thermal Testing, third edition, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Level III Study Guide: Infrared and Thermal Testing, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Questions & Answers Book: Thermal & Infrared Testing Method, latest edition, American Society for Nondestructive Testing, Columbus, OH. Wolfe, W.L. and G.J. Ziessis, eds., 1985, The Infrared Handbook, The Envi- ronmental Research Institute of Michigan (prepared for The Department of the Navy). Thermal/Infrared Testing Review Questions"},"answer":"c","section":"II","category":"Radiographic Testing","id":278},{"number":1,"question":"Thermal resistance is:","options":{"a":"analogous to electrical current.","b":"a material’s impedance to heat flow.","c":"proportional to the fourth power of emissivity.","d":"proportional to the rate of heat flow."},"answer":"b","section":"II","category":"Thermal/Infrared","id":279},{"number":2,"question":"Conductive heat transfer can take place:","options":{"a":"across a vacuum.","b":"from a hair dryer blowing on an object.","c":"between a heat lamp and a distant object.","d":"between dissimilar metals in contact with each other."},"answer":"d","section":"II","category":"Thermal/Infrared","id":280},{"number":3,"question":"The infrared/thermal energy emitted from a target surface:","options":{"a":"occurs only in a vacuum.","b":"is inversely proportional to surface emissivity.","c":"is proportional to the fourth power of the absolute surface temperature.","d":"is totally absorbed by water vapor in the air."},"answer":"c","section":"II","category":"Thermal/Infrared","id":281},{"number":4,"question":"Thermal radiation reaching the surface of a thermally opaque object can be:","options":{"a":"absorbed only.","b":"absorbed and reflected only.","c":"reflected only.","d":"transmitted and absorbed only."},"answer":"b","section":"II","category":"Thermal/Infrared","id":282},{"number":5,"question":"Which of the following spectral bands is included in the infrared spectrum?","options":{"a":"0.1 to 5.5 µm","b":"0.3 to 10.6 µm","c":"0.4 to 20 µm","d":"0.75 to 100 µm"},"answer":"d","section":"II","category":"Thermal/Infrared","id":283},{"number":6,"question":"As a surface cools, the peak of its radiated infrared energy:","options":{"a":"shifts to longer wavelengths.","b":"shifts to shorter wavelengths.","c":"remains constant if emissivity remains constant.","d":"remains constant even if emissivity varies."},"answer":"a","section":"II","category":"Thermal/Infrared","id":284},{"number":7,"question":"A graybody surface with an emissivity of 0.04 would be:","options":{"a":"transparent to infrared radiation.","b":"a fairly good emitter.","c":"almost a perfect reflector.","d":"almost a perfect emitter."},"answer":"c","section":"II","category":"Thermal/Infrared","id":285},{"number":8,"question":"If a surface has an emissivity of 0.35 and a reflectivity of 0.45, its transmissivity would be:","options":{"a":"impossible to determine without additional information.","b":"0.80.","c":"0.10.","d":"0.20."},"answer":"d","section":"II","category":"Thermal/Infrared","id":286},{"number":9,"question":"What is the spectral band in which glass transmits infrared radiation most efficiently?","options":{"a":"3 to 6 µm region","b":"2 to 3 µm region","c":"6 to 9 µm region","d":"9 to 11 µm region"},"answer":"b","section":"II","category":"Thermal/Infrared","id":287},{"number":10,"question":"Infrared thermal detectors:","options":{"a":"have a broad, flat spectral response.","b":"have much faster response times than photon detectors.","c":"usually require cooling to operate properly.","d":"have much greater sensitivity than photon detectors."},"answer":"a","section":"II","category":"Thermal/Infrared","id":288},{"number":11,"question":"A diffuse reflecting surface is:","options":{"a":"a polished surface that reflects incoming energy at a complementary angle.","b":"a surface that scatters reflected energy in many directions.","c":"also called a specular reflecting surface.","d":"highly transparent to infrared radiation."},"answer":"b","section":"II","category":"Thermal/Infrared","id":289},{"number":12,"question":"The minimum resolvable temperature difference is a subjective measurement that depends on:","options":{"a":"the infrared imaging system’s spatial resolution only.","b":"the infrared imaging system’s measurement resolution only.","c":"the infrared imaging system’s thermal sensitivity and spatial resolution.","d":"the infrared imaging system’s minimum spot size."},"answer":"c","section":"II","category":"Thermal/Infrared","id":290},{"number":13,"question":"What is the spatial resolution of an instrument related to?","options":{"a":"Thermal resolution","b":"Spectral bandwidth","c":"System responsivity","d":"Instantaneous field of view and the working distance"},"answer":"d","section":"II","category":"Thermal/Infrared","id":291},{"number":14,"question":"The noise equivalent temperature difference (NETD) of a thermal infrared imager tends to:","options":{"a":"improve as the target temperature increases.","b":"degrade as the target temperature increases.","c":"remain constant regardless of the target temperature.","d":"improve with increasing working distance."},"answer":"a","section":"II","category":"Thermal/Infrared","id":292},{"number":15,"question":"What is the 3 to 5 µm spectral region well suited for?","options":{"a":"Inspection using a microbolometer.","b":"Measuring targets at extremely long working distances.","c":"Measuring targets warmer than 200 °C (392 °F).","d":"Operating at near ambient temperatures."},"answer":"c","section":"II","category":"Thermal/Infrared","id":293},{"number":16,"question":"When measuring the temperature of glass while using a midwave (3 to 5 µm) infrared imaging system, which of the following steps is necessary?","options":{"a":"Use a 3.2 µm low-pass filter.","b":"Use a 5 µm high-pass filter.","c":"No filter is necessary if using the same emissivity setting used with long-wave imaging systems.","d":"Use a 3.9 µm bandpass filter."},"answer":"d","section":"II","category":"Thermal/Infrared","id":294},{"number":17,"question":"A line scanner is best used for applications:","options":{"a":"requiring online real-time process monitoring and control of a linear thermal process.","b":"where the material is stationary.","c":"where the process speed is no greater than 3 m/s.","d":"where the maximum temperature of the material is 300 °C (572 °F)."},"answer":"a","section":"II","category":"Thermal/Infrared","id":295},{"number":18,"question":"Most infrared focal plane array imagers:","options":{"a":"use more costly optics than scanning radiometers.","b":"offer better spatial resolution than scanning radiometers.","c":"offer better thermal resolution than scanning radiometers.","d":"offer less diagnostics features than scanning radiometers."},"answer":"b","section":"II","category":"Thermal/Infrared","id":296},{"number":19,"question":"When measuring the temperature of a nongray target:","options":{"a":"the viewing angle is not critical.","b":"always assume a uniform emissivity.","c":"varying surface temperature differences can be ignored.","d":"errors may occur when using a variety of instruments."},"answer":"d","section":"II","category":"Thermal/Infrared","id":297},{"number":20,"question":"Thermal diffusivity is:","options":{"a":"high for metals and low for porous materials.","b":"the same for all metals.","c":"low for metals and high for porous materials.","d":"the same for all porous materials."},"answer":"a","section":"II","category":"Thermal/Infrared","id":298},{"number":21,"question":"What is the term used to describe a material’s surface temperature response to a given energy input?","options":{"a":"Diffuse reflectivity.","b":"Thermal conductance.","c":"Thermal effusivity.","d":"Spectral transmittance. Ultrasonic Testing Topical Outline 2.9 Ultrasonic Testing (UT) 2.9.1 Fundamentals 2.9.1.1 Wave propagation 2.9.1.1.1 Sound fields 2.9.1.1.2 Wave travel modes 2.9.1.1.3 Refraction, reflection, scattering, and attenuation 2.9.1.2 Transducers and sound beam coupling 2.9.2 UT 2.9.2.1 Basic types of equipment 2.9.2.2 Reference standards 2.9.2.3 Test result interpretation, discontinuity indications 2.9.2.4 System factors 2.9.2.5 Applications 2.9.2.5.1 Flaw detection and evaluation 2.9.2.5.2 Thickness measurement 2.9.2.5.3 Bond evaluation 2.9.2.5.4 Process control 2.9.2.5.5 Castings 2.9.2.5.6 Weldments REFERENCES ASNT, 2007, Nondestructive Testing Handbook, Vol. 7: Ultrasonic Testing, third edition, American Society for Nondestructive Testing, Columbus, OH. ASNT, 2015, Ultrasonic Testing Classroom Training Book (PTP Series), American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Level II Study Guide: Ultrasonic Testing Method, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Level III Study Guide: Ultrasonic Method, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Questions & Answers Book: Ultrasonic Testing Method, American Society for Nondestructive Testing, Columbus, OH. UT Review Questions"},"answer":"c","section":"II","category":"Thermal/Infrared","id":299},{"number":1,"question":"Ultrasonic waves propagate through test materials in the form of:","options":{"a":"electromagnetic waves.","b":"low-voltage electric fields.","c":"discontinuous radio waves.","d":"mechanical vibrations."},"answer":"d","section":"II","category":"Ultrasonic Testing","id":300},{"number":2,"question":"When an ultrasonic beam passes through the interface of two dissimilar materials at an angle, a new angle of sound travel takes place in the second material due to:","options":{"a":"refraction.","b":"attenuation.","c":"rarefaction.","d":"compression."},"answer":"a","section":"II","category":"Ultrasonic Testing","id":301},{"number":3,"question":"What is the gradual loss of energy called as ultrasonic vibrations travel through a material?","options":{"a":"Reflection","b":"Refraction","c":"Compression","d":"Attenuation"},"answer":"d","section":"II","category":"Ultrasonic Testing","id":302},{"number":4,"question":"Ultrasonic velocities are different for different materials. These differences are primarily caused by differences in the materials’:","options":{"a":"frequency and wavelength.","b":"thickness and travel time.","c":"elasticity and density.","d":"chemistry and permeability."},"answer":"c","section":"II","category":"Ultrasonic Testing","id":303},{"number":5,"question":"Why is ultrasonic energy for immersion testing transmitted to the test object as a compressional wave?","options":{"a":"Compressional waves travel faster and will therefore reduce the distance of the interface signal.","b":"Liquids will only sustain compressional waves.","c":"Compressional waves are used with immersion testing only.","d":"The higher intensity of compressional waves is necessary to overcome high attenuation in liquids."},"answer":"b","section":"II","category":"Ultrasonic Testing","id":304},{"number":6,"question":"When inspecting coarse-grained materials, which of the following frequencies will generate a sound wave that will be most easily scattered by the grain structure?","options":{"a":"1.0 MHz","b":"2.25 MHz","c":"5 MHz","d":"10 MHz"},"answer":"d","section":"II","category":"Ultrasonic Testing","id":305},{"number":7,"question":"In general, why are shear waves more sensitive to small discontinuities than longitudinal waves for a given frequency and in a given material?","options":{"a":"The wavelength of shear waves is shorter than the wavelength of longitudinal waves.","b":"Shear waves are not as easily dispersed in the material.","c":"The direction of particle vibration for shear waves is more sensitive to discontinuities.","d":"The wavelength of shear waves is longer than the wavelength of longitudinal waves."},"answer":"a","section":"II","category":"Ultrasonic Testing","id":306},{"number":8,"question":"What term describes a transducer’s ability to detect echoes from small discontinuities?","options":{"a":"Resolution.","b":"Sensitivity.","c":"Definition.","d":"Gain."},"answer":"b","section":"II","category":"Ultrasonic Testing","id":307},{"number":9,"question":"Which of the following will create a resonance condition in a specimen?","options":{"a":"Continuous longitudinal waves.","b":"Pulsed longitudinal waves.","c":"Pulsed shear waves.","d":"Continuous shear waves."},"answer":"a","section":"II","category":"Ultrasonic Testing","id":308},{"number":10,"question":"The display on most basic pulse-echo ultrasonic instruments consists of:","options":{"a":"automatic read-out equipment.","b":"an A-scan presentation.","c":"a B-scan presentation.","d":"a C-scan presentation."},"answer":"b","section":"II","category":"Ultrasonic Testing","id":309},{"number":11,"question":"In a basic pulse-echo ultrasonic instrument, what is the component that produces the voltage that activates the search unit?","options":{"a":"An amplifier","b":"A receiver","c":"A pulser","d":"A synchronizer"},"answer":"c","section":"II","category":"Ultrasonic Testing","id":310},{"number":12,"question":"What is the primary purpose of reference blocks?","options":{"a":"To aid the operator in obtaining maximum back reflections.","b":"To obtain the greatest sensitivity possible from an instrument.","c":"To provide a known reflecting area in calibrating an instrument.","d":"To establish the size and orientation of a discontinuity."},"answer":"c","section":"II","category":"Ultrasonic Testing","id":311},{"number":13,"question":"The general use of distance-amplitude correction is to compensate for what?","options":{"a":"Attenuation, distance, and beam spread.","b":"Amplitude of noise signals.","c":"Velocity changes.","d":"Vertical nonlinearity in the ultrasonic instrument"},"answer":"a","section":"II","category":"Ultrasonic Testing","id":312},{"number":14,"question":"In area-amplitude ultrasonic standard test blocks, the flat- bottom holes in the blocks are:","options":{"a":"all the same diameters.","b":"different in diameter, increasing in size of 1/64 in. (0.0156 in.) increments from the No. 1 block to the No. 8 block.","c":"largest in the No. 1 block and smallest in the No. 8 block.","d":"drilled to different depths from the front surface of the test block."},"answer":"b","section":"II","category":"Ultrasonic Testing","id":313},{"number":15,"question":"Which of the following factors has the least influence on the amount of energy reflected from a discontinuity?","options":{"a":"Size of the discontinuity.","b":"Orientation of the discontinuity.","c":"Discontinuity type.","d":"Test frequency."},"answer":"d","section":"II","category":"Ultrasonic Testing","id":314},{"number":16,"question":"What is the ability to locate discontinuities that are close together within the material called?","options":{"a":"Resolution","b":"Sensitivity","c":"Effectiveness","d":"Phase delay"},"answer":"a","section":"II","category":"Ultrasonic Testing","id":315},{"number":17,"question":"A line scanner is best used for applications:","options":{"a":"requiring online real-time process monitoring and control of a linear thermal process.","b":"where the material is stationary.","c":"where the process speed is no greater than 3 m/s.","d":"where the maximum temperature of the material is 300 °C (572 °F)."},"answer":"a","section":"II","category":"Ultrasonic Testing","id":316},{"number":18,"question":"Most infrared focal plane array imagers:","options":{"a":"use more costly optics than scanning radiometers.","b":"offer better spatial resolution than scanning radiometers.","c":"offer better thermal resolution than scanning radiometers.","d":"offer less diagnostics features than scanning radiometers."},"answer":"b","section":"II","category":"Ultrasonic Testing","id":317},{"number":19,"question":"When measuring the temperature of a nongray target:","options":{"a":"the viewing angle is not critical.","b":"always assume a uniform emissivity.","c":"varying surface temperature differences can be ignored.","d":"errors may occur when using a variety of instruments."},"answer":"c","section":"II","category":"Ultrasonic Testing","id":318},{"number":20,"question":"Thermal diffusivity is:","options":{"a":"high for metals and low for porous materials.","b":"the same for all metals.","c":"low for metals and high for porous materials.","d":"the same for all porous materials."},"answer":"d","section":"II","category":"Ultrasonic Testing","id":319},{"number":21,"question":"What is the term used to describe a material’s surface temperature response to a given energy input?","options":{"a":"Diffuse reflectivity.","b":"Thermal conductance.","c":"Thermal effusivity.","d":"Spectral transmittance. Ultrasonic Testing Topical Outline 2.9 Ultrasonic Testing (UT) 2.9.1 Fundamentals 2.9.1.1 Wave propagation 2.9.1.1.1 Sound fields 2.9.1.1.2 Wave travel modes 2.9.1.1.3 Refraction, reflection, scattering, and attenuation 2.9.1.2 Transducers and sound beam coupling 2.9.2 UT 2.9.2.1 Basic types of equipment 2.9.2.2 Reference standards 2.9.2.3 Test result interpretation, discontinuity indications 2.9.2.4 System factors 2.9.2.5 Applications 2.9.2.5.1 Flaw detection and evaluation 2.9.2.5.2 Thickness measurement 2.9.2.5.3 Bond evaluation 2.9.2.5.4 Process control 2.9.2.5.5 Castings 2.9.2.5.6 Weldments REFERENCES ASNT, 2007, Nondestructive Testing Handbook, Vol. 7: Ultrasonic Testing, third edition, American Society for Nondestructive Testing, Columbus, OH. ASNT, 2015, Ultrasonic Testing Classroom Training Book (PTP Series), American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Level II Study Guide: Ultrasonic Testing Method, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Level III Study Guide: Ultrasonic Method, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Questions & Answers Book: Ultrasonic Testing Method, American Society for Nondestructive Testing, Columbus, OH. UT Review Questions"},"answer":"a","section":"II","category":"Ultrasonic Testing","id":320},{"number":22,"question":"In immersion testing, the water distance between the search unit and the test piece:","options":{"a":"should be as small as possible.","b":"will have no effect on the test.","c":"should be the same as the water distance used during calibration.","d":"should be as great as possible."},"answer":"c","section":"II","category":"Ultrasonic Testing","id":321},{"number":23,"question":"Generally, the best UT technique for detecting discontinuities oriented along the fusion zone in a welded plate is:","options":{"a":"an angle-beam contact method employing surface waves.","b":"an immersion test using surface waves.","c":"a resonance technique.","d":"an angle-beam method using shear waves."},"answer":"d","section":"II","category":"Ultrasonic Testing","id":322},{"number":24,"question":"When inspecting thin sheet for laminar discontinuities with the ultrasonic wave directed perpendicular to the surface, what should be observed?","options":{"a":"The amplitude of the front surface reflection.","b":"The multiple reflection pattern.","c":"The amplitude of the initial pulse.","d":"Signals that “walk” or move along the time base as the transducer is scanned over the sheet."},"answer":"d","section":"II","category":"Ultrasonic Testing","id":323},{"number":25,"question":"Ultrasonic inspection of castings is occasionally impractical because of:","options":{"a":"extremely small grain structure typical in castings.","b":"coarse grain structure.","c":"uniform flow lines.","d":"random orientation of discontinuities."},"answer":"b","section":"II","category":"Ultrasonic Testing","id":324},{"number":26,"question":"Angle-beam testing of plate will often miss:","options":{"a":"cracks that are perpendicular to the sound wave.","b":"inclusions that are randomly oriented.","c":"laminations that are parallel to the front surface.","d":"a series of small discontinuities."},"answer":"c","section":"II","category":"Ultrasonic Testing","id":325},{"number":27,"question":"In addition to a weld area being inspected by the angle- beam technique, which additional test is typically performed to detect laminations in the base metal?","options":{"a":"Through-transmission testing","b":"Guided wave testing","c":"Straight-beam testing","d":"Surface-wave testing"},"answer":"c","section":"II","category":"Ultrasonic Testing","id":326},{"number":28,"question":"An ultrasonic test using a straight-beam contact search unit is being conducted through the thickness of a flat part, such as plate. What should this test detect?","options":{"a":"Laminar-type discontinuities with major dimensions parallel to the plane of the rolled surface.","b":"Transverse-type discontinuities with major dimensions at right angles to the plane of the rolled surface.","c":"Radial discontinuities with major dimensions along the length but radially oriented to the rolled surface.","d":"Rounded discontinuities at the edges of the rolled plate."},"answer":"a","section":"II","category":"Ultrasonic Testing","id":327},{"number":29,"question":"UT techniques are useful in testing laminate and sandwich construction test objects for:","options":{"a":"paint thickness.","b":"bond integrity.","c":"leakage.","d":"surface roughness."},"answer":"b","section":"II","category":"Ultrasonic Testing","id":328},{"number":30,"question":"UT techniques are frequently used in online automatic process control applications to measure and control:","options":{"a":"moisture content in materials.","b":"surface roughness of turbine blade castings.","c":"the thickness of cold-rolled strips, sheets, and plates.","d":"chemical activity in chemical etching processes."},"answer":"c","section":"II","category":"Ultrasonic Testing","id":329},{"number":31,"question":"Which of the following statements about field inspection applications of UT is true?","options":{"a":"Manual and automatic systems can be used for field inspections.","b":"Because the equipment is large and bulky, field inspections are difficult, at best.","c":"Aircraft and other field maintenance inspections usually require three persons: one to manipulate the transducer, one to monitor the instrument, and one to record results.","d":"Digital displays must be used for outdoor inspection because of the limited brightness of screen displays."},"answer":"a","section":"II","category":"Ultrasonic Testing","id":330},{"number":32,"question":"Which of the following waves is able to follow a surface around a curve?","options":{"a":"Longitudinal wave","b":"Shear wave","c":"Surface wave","d":"Lamb wave"},"answer":"d","section":"II","category":"Ultrasonic Testing","id":331},{"number":33,"question":"The metallurgical nature of wrought iron plate or pipe is that it contains many large, flat inclusions oriented parallel to the surface. When performing thickness testing of a wrought iron pipe, which of the following may occur?","options":{"a":"The sound wave will be scattered by the inclusions.","b":"The sound wave will be reflected by large inclusions resulting in a false thickness reading.","c":"The sound wave will pass through the inclusions and an accurate thickness measurement will be attained.","d":"The sound wave will be absorbed by the inclusions. Visual Testing Topical Outline 2.10 Visual Testing (VT) 2.10.1 Fundamentals 2.10.1.1 Principles and theory of VT 2.10.1.2 Selection of correct visual technique 2.10.1.3 Equipment and materials 2.10.2 Specific applications 2.10.2.1 Metal joining processes 2.10.2.2 Pressure vessels 2.10.2.3 Pumps 2.10.2.4 Valves 2.10.2.5 Bolting 2.10.2.6 Castings 2.10.2.7 Forgings 2.10.2.8 Extrusions 2.10.2.9 Microcircuits 2.10.3 Interpretation and evaluation 2.10.3.1 Codes and standards 2.10.3.2 Environmental factors REFERENCES ASNT, 2010, Nondestructive Testing Handbook, Vol. 9: Visual Testing, third edition, American Society for Nondestructive Testing, Columbus, OH. ASNT, 1993, Nondestructive Testing Handbook, Vol. 8: Visual and Optical Testing, second edition, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Level II Study Guide: Visual Testing Method, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Level III Study Guide: Visual and Optical Testing Method, American Society for Nondestructive Testing, Columbus, OH. ASNT, 2017, Visual Testing Classroom Training Book (PTP Series), American Society for Nondestructive Testing, Columbus, OH. Visual Testing Review Questions"},"answer":"b","section":"II","category":"Ultrasonic Testing","id":332},{"number":1,"question":"VT could be best described as:","options":{"a":"detection of near surface anomalies and various color variations.","b":"optical detection of surface anomalies and checking conformance to specification.","c":"evaluation of metallurgical conditions via electronic microscope.","d":"examination for a wide variety of discontinuities open to or just below the surface."},"answer":"b","section":"II","category":"Visual Testing","id":333},{"number":2,"question":"What element of the eye is analogous to a digital camera, converting a light pattern into electronic signals?","options":{"a":"Eye muscle","b":"Iris","c":"Lens","d":"Retina"},"answer":"d","section":"II","category":"Visual Testing","id":334},{"number":3,"question":"Illumination varies inversely as the square of the distance between the source and the point on the surface increases. What is this law called?","options":{"a":"Inverse square law","b":"Cosine law","c":"Generation of light law","d":"Lambert’s law"},"answer":"a","section":"II","category":"Visual Testing","id":335},{"number":4,"question":"When measuring surface roughness, Ra is defined as what?","options":{"a":"Average distance between the highest and lowest points.","b":"Average waviness from crest to trough.","c":"Average distance of the profile to the mean line.","d":"Parameter of friction between contact surfaces."},"answer":"c","section":"II","category":"Visual Testing","id":336},{"number":5,"question":"What is the minimum luminance recommended by the Illuminating Engineering Society (IES) for task lighting with medium contrast and small size detection desired?","options":{"a":"100 lx","b":"200 lx","c":"500 lx","d":"2000 lx"},"answer":"c","section":"II","category":"Visual Testing","id":337},{"number":6,"question":"What is the direction of view called in a borescope or videoscope when viewing 45° off the straight-ahead direction of the probe?","options":{"a":"Forward slant","b":"Forward oblique","c":"Retrospective","d":"Angulated"},"answer":"b","section":"II","category":"Visual Testing","id":338},{"number":7,"question":"How many bundles are there in a fiberscope and what are they called?","options":{"a":"One; monochromatic bundle.","b":"Two; light guide and image guide.","c":"Two; light guide and CCD cable bundle.","d":"Three; light guide, image guide, and fiber sheath."},"answer":"b","section":"II","category":"Visual Testing","id":339},{"number":8,"question":"What is a commonly evident surface discontinuity visible to the unaided eye following forming?","options":{"a":"Forging bursts at the center of the billet.","b":"Laminations at end preparations of plate for welding.","c":"Edge breaks in temper-rolled sheets of steel.","d":"Segregation between pours."},"answer":"c","section":"II","category":"Visual Testing","id":340},{"number":9,"question":"What type of cracking occurs at the termination point of a weld made by tungsten inert gas welding?","options":{"a":"Crater crack","b":"Hot tearing","c":"Cold cracking","d":"Hot cracking"},"answer":"a","section":"II","category":"Visual Testing","id":341},{"number":10,"question":"What is pillowing corrosion on aircraft lap joints, typically on aircraft skins, usually attributed to?","options":{"a":"Misalignment corrosion of fasteners used to attach the skins to the airframe.","b":"Stretching of the skins beyond their yield points over time.","c":"Expansion of corrosion products under the skins.","d":"Twisting of the airframe during tight turns and similar maneuvers."},"answer":"c","section":"II","category":"Visual Testing","id":342},{"number":11,"question":"When inspecting welds for discontinuities located by VT, which of the following discontinuities is usually judged the least detrimental, depending on its depth?","options":{"a":"Undercut","b":"Cracks","c":"Lack of fusion","d":"Incomplete penetration"},"answer":"a","section":"II","category":"Visual Testing","id":343},{"number":12,"question":"How can the heat-affected zone (HAZ) of carbon steel welds be made visible?","options":{"a":"Etchants to enhance the visibility of the microstructure.","b":"High-frequency ultrasonic microscopic means.","c":"Color-contrast penetrating liquids.","d":"Arrays of temperature-sensitive markings."},"answer":"a","section":"II","category":"Visual Testing","id":344},{"number":13,"question":"Reflectance is a measure of:","options":{"a":"the reactance of a coating.","b":"the mirror-like reflectance of a surface.","c":"the amount of artificial light at the inspection surface.","d":"the flatness of a finish coating."},"answer":"b","section":"II","category":"Visual Testing","id":345},{"number":14,"question":"A datum:","options":{"a":"is a theoretical point identified on the blueprint.","b":"is a theoretical point, axis, or plane, derived from actual part features.","c":"is a feature controlled by two separate datums.","d":"has form only in terms of itself."},"answer":"b","section":"II","category":"Visual Testing","id":346},{"number":15,"question":"Color order systems describe color by:","options":{"a":"value and brightness saturation.","b":"primary and secondary colors.","c":"value, hue, and saturation.","d":"value of the primary color constituents."},"answer":"c","section":"II","category":"Visual Testing","id":347},{"number":16,"question":"How can a concave mirror be helpful during visual inspection?","options":{"a":"By enlarging the image viewed.","b":"By diverging and optically reversing small images.","c":"By converging and optically reversing small images.","d":"By increasing the light returned to the inspector."},"answer":"a","section":"II","category":"Visual Testing","id":348},{"number":17,"question":"Which weld discontinuity would NOT be visually evident when examining a completed fillet weld?","options":{"a":"Weld profile","b":"Crater crack","c":"Incomplete penetration","d":"Undercut"},"answer":"c","section":"II","category":"Visual Testing","id":349},{"number":1,"question":"Most solid metals and plastics that have reasonable strength at room temperature are called:","options":{"a":"composite materials.","b":"manufacturing materials.","c":"allotropic materials.","d":"engineering materials."},"answer":"d","section":"III","category":"Ch. 1: Manufacturing and Materials","id":350,"reference":"[1.1]"},{"number":2,"question":"“Manufacturing” refers to processing that starts with raw material in a bulk form and is concerned mainly with processing the raw material in a manner that changes its:","options":{"a":"shape.","b":"chemical form.","c":"mechanical properties.","d":"physical properties."},"answer":"a","section":"III","category":"Ch. 1: Manufacturing and Materials","id":351,"reference":"[1.5]"},{"number":3,"question":"Frequently, dimensions are permitted to vary within specified limits. These variations are called:","options":{"a":"variances.","b":"fudge factors.","c":"tolerances.","d":"factors of safety."},"answer":"c","section":"III","category":"Ch. 1: Manufacturing and Materials","id":352,"reference":"[1.6.2]"},{"number":4,"question":"Design engineers are responsible for establishing the function, appearance, quality, and cost of a product. Regarding the role of nondestructive testing (NDT) in product design, which of the following is true?","options":{"a":"As a group, designers (by their training and education) are adequately informed about NDT to establish NDT procedures and acceptance criteria.","b":"When NDT appears necessary in a design, the designer should properly select the methods and techniques to be used by reference to NDT handbooks.","c":"Designers should depend solely upon NDT personnel to establish acceptance criteria.","d":"Designers should seek input from NDT personnel to ensure all required inspections can be performed. [1.6.3] Chapter 2: Classification, Structure, and Solidification of Materials"},"answer":"d","section":"III","category":"Ch. 1: Manufacturing and Materials","id":353},{"number":1,"question":"In general, metals exist as:","options":{"a":"amorphous solids.","b":"mixtures and compounds of iron and carbon.","c":"crystalline solids.","d":"face-centered cubic lattices."},"answer":"c","section":"III","category":"Ch. 2: Classification, Structure, and Solidification of Materials","reference":"[2.4]","id":354},{"number":2,"question":"The terms “body-centered cubic,” “face-centered cubic,” and “hexagonal close-packed” all refer to the:","options":{"a":"different sized grains that can exist at the same time in a metallic structure.","b":"sequence of crystalline growth in a typical mild steel.","c":"lattice structures that make up unit cells in a solid metallic structure.","d":"change in a metallic structure as it undergoes plastic deformation."},"answer":"c","section":"III","category":"Ch. 2: Classification, Structure, and Solidification of Materials","reference":"[2.4]","id":355},{"number":3,"question":"Which of the following materials is NOT typically used in the as-cast state?","options":{"a":"Aluminum","b":"Pure iron","c":"Zinc","d":"Magnesium"},"answer":"b","section":"III","category":"Ch. 2: Classification, Structure, and Solidification of Materials","reference":"[2.5.4]","id":356},{"number":4,"question":"Processes called “austenitizing,” “annealing,” and “normalizing” are:","options":{"a":"approximate equilibrium heat-treatment processes.","b":"performed only on nonferrous metals.","c":"cold-working processes.","d":"age-hardening processes."},"answer":"a","section":"III","category":"Ch. 2: Classification, Structure, and Solidification of Materials","reference":"[2.6.3]","id":357},{"number":5,"question":"Annealing is usually performed to:","options":{"a":"increase hardness.","b":"increase strength.","c":"remove strain hardening.","d":"increase impact toughness."},"answer":"c","section":"III","category":"Ch. 2: Classification, Structure, and Solidification of Materials","id":358},{"number":6,"question":"The term “precipitation hardening” is often used interchangeably with the term:","options":{"a":"age hardening.","b":"recrystallization.","c":"annealing.","d":"work hardening."},"answer":"a","section":"III","category":"Ch. 2: Classification, Structure, and Solidification of Materials","id":359},{"number":7,"question":"In a tensile test on a cylindrical specimen, the strain measured on the specimen gauge length is used to calculate:","options":{"a":"age hardening.","b":"hardness.","c":"the modulus of elasticity.","d":"instability."},"answer":"c","section":"III","category":"Ch. 2: Classification, Structure, and Solidification of Materials","id":360},{"number":8,"question":"Which of the following material properties are of most concern if corrosion resistance is essential?","options":{"a":"Processing properties","b":"Mechanical properties","c":"Physical properties","d":"Electrochemical properties"},"answer":"d","section":"III","category":"Ch. 2: Classification, Structure, and Solidification of Materials","id":361},{"number":9,"question":"Attacks on metals by direct chemical action and/or electrolysis are called:","options":{"a":"corrosion.","b":"erosion.","c":"austenitic transformations.","d":"galvanization."},"answer":"a","section":"III","category":"Ch. 2: Classification, Structure, and Solidification of Materials","id":362},{"number":10,"question":"Which of the following groups prevent corrosion?","options":{"a":"Anodizing, plating, and painting","b":"Insulating, jacketing, and strapping","c":"Annealing, normalizing, and hardening","d":"Ductility, enlarged grains, and increased hardness [2.6.3]"},"answer":"a","section":"III","category":"Ch. 2: Classification, Structure, and Solidification of Materials","reference":"[2.7.4]","id":363},{"number":11,"question":"The process of returning ductility to a cold-worked low- carbon steel is called:","options":{"a":"precipitation.","b":"recrystallization.","c":"allotropic change.","d":"austenitization. [2.6.4]"},"answer":"b","section":"III","category":"Ch. 2: Classification, Structure, and Solidification of Materials","reference":"[2.8.6]","id":364},{"number":12,"question":"The primary goal of alloying for engineering materials is:","options":{"a":"to introduce substitutional or interstitial impurities.","b":"to increase the cost of manufacturing.","c":"to create point or line defects in the crystal lattice.","d":"to increase the strength of the nucleus. [2.8.7]"},"answer":"a","section":"III","category":"Ch. 2: Classification, Structure, and Solidification of Materials","reference":"[2.6.5]","id":365},{"number":1,"question":"A common industrial example of atomic diffusion is:","options":{"a":"carburization of low-carbon steel.","b":"electron beam melting of a nickel-based super alloy.","c":"structural adhesive used in a demanding application.
