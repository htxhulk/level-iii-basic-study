:root{--bg:#0b1020;--card:#151c2f;--card2:#1e293b;--text:#f8fafc;--muted:#a8b3c7;--accent:#60a5fa;--good:#34d399;--bad:#fb7185;--border:#334155}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080d1a,#111827);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}header{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 16px}h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}main{max-width:760px;margin:auto;padding:16px 16px 90px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 8px 28px rgba(0,0,0,.18)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--card2);border-radius:12px;padding:12px}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;background:#2563eb;color:white;cursor:pointer;font-size:15px}button.secondary{background:#334155}button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}button.good{background:#059669}.actions{display:flex;gap:8px;flex-wrap:wrap}.category{padding:13px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center}.category:last-child{border-bottom:0}.category .name{font-weight:700}.small{font-size:12px;color:var(--muted)}.qmeta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-bottom:10px}.question{font-size:19px;line-height:1.4;font-weight:700;margin:8px 0 15px}.option{display:block;width:100%;text-align:left;margin:8px 0;background:#202a3d;border:1px solid #3b475d;padding:13px;border-radius:12px;font-weight:500;line-height:1.35}.option.correct{border-color:var(--good);background:#064e3b}.option.wrong{border-color:var(--bad);background:#4c1020}.feedback{border-radius:12px;padding:12px;margin-top:12px;background:#0f172a;border:1px solid var(--border)}.goodtext{color:#6ee7b7}.badtext{color:#fda4af}.navbar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,15,28,.97);border-top:1px solid var(--border);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:30}.navbar button{background:transparent;color:var(--muted);padding:9px 15px;font-size:12px}.navbar button.active{color:white;background:#1e293b}input{width:100%;background:#111827;color:white;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:15px;margin:6px 0 10px}.progressbar{height:8px;background:#293548;border-radius:8px;overflow:hidden}.progressbar i{height:100%;background:#3b82f6;display:block}.figure{width:100%;border-radius:10px;background:white;margin:10px 0;max-height:400px;object-fit:contain}.center{text-align:center}.notice{font-size:12px;color:var(--muted);line-height:1.4}.search-result{padding:10px 0;border-bottom:1px solid var(--border)}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}

<script>
const Q=[{"number":1,"question":"Which of the following statements is true concerning the usage of SNT-TC-1A?","options":{"a":"SNT-TC-1A is intended for use by a limited set of industrial segments.","b":"SNT-TC-1A was generated to satisfy the specification requirements of ASME.","c":"SNT-TC-1A was last revised in 1988.","d":"SNT-TC-1A is not intended to be used as a strict specification."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":1},{"number":2,"question":"The SNT-TC-1A Interpretation Panel will respond to inquiries about SNT-TC-1A. The inquiry must be:","options":{"a":"written and stated in general terms.","b":"written including specific details of the case, such as names, places, dates, and other pertinent facts.","c":"considered by the ASNT Board of Directors if it involves decisions that would place ASNT in a position between buyer and seller.","d":"ruled upon by the Technical and Education Council of ASNT before the SNT-TC-1A Interpretation Panel prepares a response."},"answer":"a","section":"I","category":"SNT-TC-1A (2024)","id":2},{"number":3,"question":"Which of the following statements is true?","options":{"a":"ASNT has been providing certification examinations for Level III personnel since the late 1960s.","b":"SNT-TC-1A was first published in the late 1960s.","c":"SNT-TC-1A requires that Level III personnel be qualified and certified by ASNT.","d":"SNT-TC-1A was developed to satisfy requirements for NDT personnel qualification and certification set forth in parts of the ASME Boiler & Pressure Vessel Code."},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":3},{"number":4,"question":"With regard to the training of NDT personnel, the employer:","options":{"a":"must conduct all of the training on the premises.","b":"may engage an outside service who must conduct the training on the employer’s premises.","c":"should not conduct the training, being too close to the company’s problems.","d":"may engage an outside service but is, nevertheless, responsible for the certification of the company’s NDT personnel."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":4},{"number":5,"question":"SNT-TC-1A is intended as a guideline for employers:","options":{"a":"to establish their own written practice that must be used as a strict specification.","b":"to establish their own written practice for the qualification and certification of their NDT personnel.","c":"to define training course requirements for contractors performing outside training services.","d":"who are corporate members of ASNT."},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":5},{"number":6,"question":"The following is a statement in SNT-TC-1A: “It is recognized that these guidelines may not be appropriate for certain employers, circumstances, and/or applications.” What should be done if the guidelines are not appropriate?","options":{"a":"The employer must change its operations to conform to the guidelines.","b":"The employer must seek relief from ASNT for inappropriate applications.","c":"The employer should review the detailed recommendations and modify them, as necessary, to meet its particular needs with justification documented in an annex to the written practice.","d":"The employer shall submit an inquiry in writing directed to the SNT-TC-1A Interpretation Panel."},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":6},{"number":7,"question":"Which of the following statements is true?","options":{"a":"Qualification is the sum total of training and experience.","b":"The employer may not certify Level III personnel.","c":"A certifying agency is any organization used by an employer in training NDT personnel.","d":"Certification is written testimony of qualification."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":7},{"number":8,"question":"Who should be responsible to assess whether or not an individual should be qualified and certified who does not perform NDT, but monitors and evaluates NDT?","options":{"a":"ASNT.","b":"The individual’s employer.","c":"A government regulatory agency.","d":"The customer’s auditor."},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":8},{"number":9,"question":"In SNT-TC-1A (2024) holographic testing is a technique under which of the following NDT methods?","options":{"a":"Visual testing.","b":"Guided wave testing.","c":"Acoustic emission testing.","d":"Laser testing."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":9},{"number":10,"question":"ASNT intended that the recommendations of SNT-TC-1A be applied:","options":{"a":"with flexibility and reason.","b":"precisely as written.","c":"as minimum requirements.","d":"as maximum requirements."},"answer":"a","section":"I","category":"SNT-TC-1A (2024)","id":10},{"number":11,"question":"Of the following, which is most appropriate to determine the needs to qualify and certify personnel whose only NDT function is to operate digital thickness equipment?","options":{"a":"ASNT.","b":"ASME.","c":"The employer.","d":"The customer."},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":11},{"number":12,"question":"Certification is:","options":{"a":"the skill, training, and experience required for personnel to properly perform the duties of a specific job.","b":"written testimony of qualification.","c":"intended to be conferred by an organization independent from the employer.","d":"intended to be conferred by an organization hired by the employer."},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":12},{"number":13,"question":"Use of SNT-TC-1A is mandatory when:","options":{"a":"the material being tested is for a US Air Force contract.","b":"the material being tested is for a US Navy contract.","c":"it has been specified by the customer.","d":"the material being tested is for a US Army contract that requires certification of NDT personnel. Section 4.0"},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":13},{"number":14,"question":"The basic levels of qualification recommended by SNT-TC-1A are:","options":{"a":"trainee, Level I, Level II, and Level III.","b":"trainee, apprentice, Level I, Level II, and Level III.","c":"Level I, Level II, and Level III.","d":"Level I, Level II, Level III, and instructor."},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":14},{"number":15,"question":"Should personnel who operate ultrasonic digital thickness measurement equipment be qualified and certified?","options":{"a":"Yes, because SNT-TC-1A requires that all personnel performing NDT be qualified and certified.","b":"No, because SNT-TC-1A does not cover that specific operation.","c":"Only if required by industry codes, standards, and specifications.","d":"Whether any NDT personnel should be qualified and certified depends solely upon the needs of the employer and the requirements of the employer’s customers or clientele."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":15},{"number":16,"question":"According to the recommendations of SNT-TC-1A, which of the following is true concerning a trainee’s activities?","options":{"a":"The trainee may not conduct nondestructive tests independently and may not report test results.","b":"The trainee may not conduct nondestructive tests independently, but may interpret test results if acting under written instructions.","c":"The trainee should work along with a certified individual and may be considered a Level I, provided that the certified individual cosigns any test reports.","d":"Once the trainee has worked along with a certified individual, the trainee may then independently perform any activities as directed by the certified individual."},"answer":"a","section":"I","category":"SNT-TC-1A (2024)","id":16},{"number":17,"question":"According to SNT-TC-1A (2024), which of the following is mandatory for certification of a Level III?","options":{"a":"Shall be capable of assisting in establishment of acceptance criteria.","b":"Shall meet the requirements of the employer’s written practice.","c":"Shall be familiar with other commonly used NDT methods.","d":"Shall be capable of establishing techniques and selecting test methods."},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":17},{"number":18,"question":"According to written instructions, an NDT Level I may:","options":{"a":"develop and establish techniques.","b":"perform specific calibrations, specific nondestructive tests, and specific evaluations.","c":"perform ultrasonic phased array tests.","d":"provide direction to trainees and other Level I personnel."},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":18},{"number":19,"question":"May a Level I independently perform, evaluate, and sign for results of nondestructive tests with supervision and guidance from a Level II or III?","options":{"a":"Yes, the intent in SNT-TC-1A is that the Level I may perform the above functions provided that they are in accordance with written instruction of a Level II or III.","b":"No, the Level I may perform the above functions in accordance with written procedures, but must be under constant supervision and guidance of a Level II or Level III.","c":"No, the Level I may not sign for test results.","d":"No, the Level I is not allowed to take any independent action."},"answer":"a","section":"I","category":"SNT-TC-1A (2024)","id":19},{"number":20,"question":"Which of the following statements is true concerning the definitions of trainee, Level I, II, and III in SNT-TC-1A?","options":{"a":"The qualifications for Level III equal and exceed those of Level II.","b":"SNT-TC-1A was intended for use by employers to determine the proficiency of individuals at each level.","c":"Except for a provision for a trainee, Levels I, II, and III may not be further subdivided. Level IIIs may not perform Level II functions unless they pass Level II examinations.","d":"A trainee may perform all of the functions of a Level I if following written instructions."},"answer":"a","section":"I","category":"SNT-TC-1A (2024)","id":20},{"number":21,"question":"Which of the following is within the scope of activities of a Level II individual, as recommended in SNT-TC-1A?","options":{"a":"Calibrate equipment.","b":"Establish techniques.","c":"Standardize equipment.","d":"Administer and score exams."},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":21},{"number":22,"question":"As recommended in SNT-TC-1A, a Level II:","options":{"a":"may conduct on-the-job training and guidance of Level I personnel, with the Level I training and guiding trainees.","b":"is responsible for the training and examination of Level I personnel for certification.","c":"must be capable of and responsible for establishing techniques.","d":"may conduct on-the-job training and guidance of Level I personnel."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":22},{"number":23,"question":"According to SNT-TC-1A, which of the following is true for a Level III?","options":{"a":"A Level III must have successfully completed at least two years of science or engineering study at a college or university.","b":"It is desirable that a Level III be a registered professional engineer.","c":"The Level III is responsible for establishing all acceptance criteria.","d":"The Level III shall be capable of evaluating test results in terms of codes, standards, and specifications. Section 5.0"},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":23},{"number":24,"question":"In accordance with SNT-TC-1A, who is responsible for establishing a written practice for the control and administration of NDT personnel training, examination, and certification?","options":{"a":"The NDT Level III.","b":"The employer.","c":"ASNT.","d":"An appropriate regulatory authority."},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":24},{"number":25,"question":"The responsibility of each level of certification for determining the acceptability of materials or components:","options":{"a":"need not be described in the employer’s written practice since those responsibilities are defined specifically in SNT-TC-1A.","b":"should be described in the employer’s written practice only if they are different from SNT-TC-1A recommendations.","c":"should be described in the employer’s written practice under all circumstances.","d":"should be described in the employer’s written practice if dictated by customer requirements. Section 6.0"},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":25},{"number":26,"question":"What factors are to be considered to ensure that a candidate for certification in NDT understands the principles and procedures involved?","options":{"a":"Training, experience, and education.","b":"Training, experience, and prior certifications held.","c":"Education, experience, and percentage of time on the job doing NDT.","d":"Training, experience, and professional credentials."},"answer":"a","section":"I","category":"SNT-TC-1A (2024)","id":26},{"number":27,"question":"As recommended in SNT-TC-1A, which of the following is true?","options":{"a":"Overtime cannot be considered in meeting the minimum experience.","b":"Overtime can only be considered if the candidate is being qualified in more than one method simultaneously.","c":"Overtime can be credited based on total hours.","d":"SNT-TC-1A does not currently provide a recommendation regarding overtime."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":27},{"number":28,"question":"High school education is recommended as a minimum requirement for:","options":{"a":"Level III only.","b":"Level II and Level III only.","c":"none of the levels.","d":"all three levels."},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":28},{"number":29,"question":"In leak testing, recommended work time experience and training:","options":{"a":"differ for each of four major techniques.","b":"do not consider different techniques.","c":"are listed for Levels II and III only.","d":"are significantly greater than for ultrasonic testing."},"answer":"a","section":"I","category":"SNT-TC-1A (2024)","id":29},{"number":30,"question":"It is recommended that the education and experience of a Level III candidate include:","options":{"a":"graduation from a four-year university or college with a degree in engineering or science, plus one additional year of experience beyond the Level II requirements, with that assignment being comparable to that of an NDT Level II in the applicable method.","b":"graduation from a four-year college or university with a degree in NDT plus three months’ experience in NDT comparable to that of a Level II.","c":"two years’ experience in NDT comparable to that of a Level II if a high school graduate.","d":"six years’ experience in NDT if the candidate did not graduate from high school."},"answer":"a","section":"I","category":"SNT-TC-1A (2024)","id":30},{"number":31,"question":"Records substantiating training and experience for qualification are recommended to be kept on a(n):","options":{"a":"daily or weekly basis.","b":"hourly basis.","c":"fractional yearly basis.","d":"fractional hourly basis."},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":31},{"number":32,"question":"For a person being qualified directly to Level II with no time at Level I, the recommended experience consists of:","options":{"a":"the time recommended for Level II.","b":"the time recommended for Level III.","c":"the sum of the times recommended for Level I and Level II.","d":"not less than six months for any method."},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":32},{"number":33,"question":"In some cases, the training times recommended for Level I are greater than for Level II. Why?","options":{"a":"In preparing for qualification at Level I, the candidate should always receive more training than for Level II, regardless of the NDT method.","b":"Some numbers in the table are erroneous.","c":"Candidates for Level II generally have more formal education than those for Level I.","d":"Some methods require more initial training at Level I because of differences in complexity and manipulative skills."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":33},{"number":34,"question":"The recommended number of training hours in a particular method are:","options":{"a":"listed as a function of the candidate’s education.","b":"the same regardless of the candidate’s education.","c":"listed as a function of the candidate’s experience.","d":"reduced if the candidate is being qualified in more than one method simultaneously. Section 7.0"},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":34},{"number":35,"question":"It is recommended that a training program for qualification and certification purposes should include:","options":{"a":"one-on-one practical instruction by the Level III.","b":"training applicable to all industries where the method is used.","c":"examinations to verify that the training material has been comprehended.","d":"a practical examination to verify that the training material has been comprehended."},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":35},{"number":36,"question":"Recommended training course outlines:","options":{"a":"are included in CP-105 and must not be modified.","b":"are included in the most recent editions of SNT-TC-1A.","c":"are not available for visual and leak testing.","d":"are included in CP-105 for the methods listed."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":36},{"number":37,"question":"Recommended training reference material:","options":{"a":"is available only through ASNT.","b":"is available from a variety of sources.","c":"can only include those references listed in CP-105.","d":"must be made available to each trainee."},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":37},{"number":38,"question":"The recommended training course outline includes:","options":{"a":"technical principles of the method.","b":"review of API 1104 requirements.","c":"review of ASTM guidelines.","d":"review of interpretation requirements in ASME B31.3. Section 8"},"answer":"a","section":"I","category":"SNT-TC-1A (2024)","id":38},{"number":39,"question":"In accordance with SNT-TC-1A, the NDT Level III should be responsible for:","options":{"a":"ensuring Level II personnel examine Level I personnel.","b":"interpretation of all test results obtained by Level II personnel.","c":"all questions to be used on examinations for Level I and Level II.","d":"writing all company standard operating procedures."},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":39},{"number":40,"question":"Which of the following may conduct and grade examinations for Level I and Level II personnel?","options":{"a":"An NDT Level II.","b":"A qualified representative of the NDT Level III.","c":"ASNT personnel because they offer examinations on a regular basis.","d":"The company president."},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":40},{"number":41,"question":"How often should the near-vision acuity examination be administered?","options":{"a":"Semiannually.","b":"At five-year intervals.","c":"Annually.","d":"Once only, upon initial certification."},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":41},{"number":42,"question":"As recommended in SNT-TC-1A, physical examination requirements are intended to be:","options":{"a":"the same for all methods.","b":"the same for all employers.","c":"related to each employer’s specific needs.","d":"as specified in applicable sections of the ASME Boiler & Pressure Vessel Code."},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":42},{"number":43,"question":"The General examination is intended to cover:","options":{"a":"basic test principles of the method.","b":"only the material included in the training course outlines of SNT-TC-1A.","c":"the equipment operational capabilities of the candidate.","d":"the operating procedures that the candidate may encounter in the job."},"answer":"a","section":"I","category":"SNT-TC-1A (2024)","id":43},{"number":44,"question":"What is the proper use of ASNT Questions & Answers Books?","options":{"a":"To create Practical exam questions.","b":"To develop questions for ASNT certification tests.","c":"To compile the General and Specific examinations.","d":"To help prepare for exams, not to write them."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":44},{"number":45,"question":"Which of the following parts of Level I and Level II examinations should be written?","options":{"a":"The General and Specific examinations.","b":"The General and Practical examinations.","c":"The General, Specific, and Practical examinations.","d":"Only the General examination."},"answer":"a","section":"I","category":"SNT-TC-1A (2024)","id":45},{"number":46,"question":"The Practical examination is recommended to include operational familiarity with test equipment and analysis of test results for:","options":{"a":"Levels I, II, and III.","b":"Levels I and II.","c":"Levels II and III.","d":"trainee, Level I, and Level II."},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":46},{"number":47,"question":"Which of the following statements is true with regard to the administration of written examinations?","options":{"a":"The examinee should not be permitted access to any reference material.","b":"Reference data may be supplied for the Practical examination only.","c":"Level III personnel should be required to memorize everything except codes, specifications, and procedures.","d":"Codes, specifications, and procedures may be provided to examinees for reference during examinations provided that they do not contain data that can be used to answer questions in the General examination."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":47},{"number":48,"question":"For the written examinations, tables, graphs, and charts may be used:","options":{"a":"only during Level I examinations.","b":"only during Level II examinations.","c":"during all examinations.","d":"only for the Level II Practical examination."},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":48},{"number":49,"question":"For Level I and Level II Practical examinations, one or more test specimens are recommended, and the examinee should perform tests and evaluations using the appropriate equipment and test specimens. The minimum number of different checkpoints recommended is:","options":{"a":"5","b":"10","c":"15","d":"20"},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":49},{"number":50,"question":"For Level I and II examinations, the recommended minimum composite score is:","options":{"a":"60%.","b":"90%.","c":"70%.","d":"80%."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":50},{"number":51,"question":"For Level III Basic examinations, it is recommended that Level II questions also be included. These questions should be:","options":{"a":"Level II questions based on other applicable NDT methods.","b":"based on Level II tasks for the particular method examination.","c":"selected at random from questions previously used on Level II examinations.","d":"given only if the candidate is being examined in more than one method. Section 9.0"},"answer":"a","section":"I","category":"SNT-TC-1A (2024)","id":51},{"number":52,"question":"If an outside agency is engaged to provide Level III services, the:","options":{"a":"written practice of the outside agency pertains, and it is not necessary for the employer that uses the outside services to have a written practice.","b":"responsibility of certification must be retained by the employer using outside services.","c":"employer using outside services must nonetheless have a Level III in direct employment.","d":"outside agency may certify the personnel of the employer using outside services."},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":52},{"number":53,"question":"What purpose is best served by maintaining certification records and the written practice?","options":{"a":"Periodic approval by ASNT.","b":"To determine the effectiveness of outside services.","c":"To provide documentation for review by customers, clients, and regulatory agencies.","d":"To protect against product liability claims."},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":53},{"number":54,"question":"The employer is responsible for certification of:","options":{"a":"Level I and Level II NDT personnel.","b":"Level III personnel only.","c":"outside services.","d":"all levels of NDT personnel."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":54},{"number":55,"question":"The employer can consider an individual to be qualified to Level III, but only if they:","options":{"a":"take a comprehensive written examination.","b":"have in excess of five (5) years’ experience comparable to a Level II.","c":"meet the requirements of the employer’s written practice.","d":"have taken the ASNT NDT Level III Basic examination and at least one of the method examinations. Section 10.0"},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":55},{"number":56,"question":"According to SNT-TC-1A (2024), the employer shall:","options":{"a":"reexamine Level I and Level II personnel annually.","b":"reexamine Level I and Level II personnel every two (2) years.","c":"reexamine Level I and Level II personnel every five (5) years.","d":"reexamine Level I and Level II personnel anytime at the discretion of the employer."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":56},{"number":57,"question":"The technical performance evaluation:","options":{"a":"must be performed at the mid-point of the certification interval.","b":"consists of a Practical examination following the format and guidelines of the Practical examination used for initial qualification.","c":"is not required if the performance of Level II duties has been satisfactory over the current certification period.","d":"may be performed on actual product during the course of normal testing. Section 11.0"},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":57},{"number":58,"question":"Regarding personnel service, SNT-TC-1A (2024) states:","options":{"a":"if Level I or Level II personnel service is interrupted by more than three (3) months, they must recertify by examination.","b":"if Level I or Level II personnel service is interrupted by more than three (3) months (except for military duty or maternity leave), they must recertify by examination.","c":"if Level I or Level II personnel service is interrupted by more than six (6) months, they must recertify by examination.","d":"the employer’s written practice should include rules covering the types and duration of interrupted service that requires reexamination and recertification. Section 12.0"},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":58},{"number":59,"question":"Which of the following statements is true concerning recertification?","options":{"a":"Recertification can be accomplished only by reexamination at least once every three (3) years.","b":"Recertification can be based upon evidence of continuing satisfactory performance.","c":"Once certified to a particular level, certification can only be terminated if the certified individual terminates employment with the certifying employer.","d":"Reexamination of a certified individual can be accomplished only after three (3) years at a particular level."},"answer":"b","section":"I","category":"SNT-TC-1A (2024)","id":59},{"number":60,"question":"According to SNT-TC-1A (2024), when a new technique is added to the employer’s written practice, the NDT Level III personnel:","options":{"a":"may be “grandfathered” into the technique.","b":"should first meet the requirements of Level II before being certified as a Level III in the new technique.","c":"should be qualified to the new technique in accordance with the employer’s written practice.","d":"should receive applicable training, take applicable examinations, and obtain the necessary experience, such that the NDT Level III meets the requirements of the new techniques in Table 6.3.1A, prior to their next recertification date, in the applicable method. Section 13.0"},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":60},{"number":61,"question":"Automatic termination of certification is recommended when the certified individual:","options":{"a":"terminates employment with the employer where certified.","b":"is temporarily assigned to a different job function.","c":"takes a leave of absence greater than 30 days.","d":"achieves a higher level of certification."},"answer":"a","section":"I","category":"SNT-TC-1A (2024)","id":61},{"number":62,"question":"A certified Level III individual terminates their employment with employer A and is immediately employed by employer B. Employer B may certify the individual as Level III based upon which of the following?","options":{"a":"The employer must examine the individual if he or she has not been working as a Level III during the past six (6) months.","b":"The employer may recertify the individual to Level III, but only after six (6) months of satisfactory service.","c":"The employer must examine the individual.","d":"The employer may certify the individual to Level III in accordance with the written practice."},"answer":"c","section":"I","category":"SNT-TC-1A (2024)","id":62},{"number":63,"question":"An NDT Level II individual terminates their employment with their employer and starts employment with another employer outside of NDT for three (3) months. Is it possible for the individual to return to their previous employer and be reinstated to their former Level II status after being removed from NDT for three (3) months?","options":{"a":"Yes.","b":"Not unless the employer meets all relevant recertification requirements in the employer’s written practice.","c":"The employer must retrain the employee.","d":"Yes, provided the previous employer maintained relevant certification records for the employee."},"answer":"d","section":"I","category":"SNT-TC-1A (2024)","id":63},{"number":1,"question":"In accordance with CP-189 (2024), an NDT Level III:","options":{"a":"shall be responsible for grading all Level I and Level II certification examinations.","b":"must prepare all training materials for NDT Level I and Level II personnel.","c":"must approve all questions to be used on examinations for Level I and Level II.","d":"must administer all NDT Level I and II written examinations."},"answer":"c","section":"I","category":"CP-189 (2024)","id":64},{"number":2,"question":"Which of the following is true regarding NDT Level III Practical examinations?","options":{"a":"This examination requirement may be waived if the candidate holds a currently valid ASNT NDT Level III certificate.","b":"The exam administrator must hold a valid ASNT Level III certification in the applicable test method.","c":"The use of a written checklist may be used at the discretion of the administrator.","d":"Exam administration may be delegated to any authorized representative by the employer."},"answer":"b","section":"I","category":"CP-189 (2024)","id":65},{"number":3,"question":"When the near-distance visual acuity examination is given using a Jaeger reading card, it must be given:","options":{"a":"in accordance with a procedure.","b":"by any company NDT Level III.","c":"by medical personnel only.","d":"biannually if Jaeger J-1 letters are used."},"answer":"a","section":"I","category":"CP-189 (2024)","id":66},{"number":4,"question":"As required in CP-189, NDT Level I Practical examinations are intended to be:","options":{"a":"given by the employer’s Level III.","b":"passed only if all predefined discontinuities are detected and evaluated.","c":"given using one or more test samples for each technique.","d":"given using one or more test samples for each method."},"answer":"c","section":"I","category":"CP-189 (2024)","id":67},{"number":5,"question":"The Practical examination shall address the technical and practical competency of the examinee when following prepared NDT procedures for:","options":{"a":"NDT Level I, NDT Level II, and NDT instructor.","b":"corporate Level IIIs.","c":"all levels of qualification including the trainer or instructor.","d":"NDT Levels I and II."},"answer":"d","section":"I","category":"CP-189 (2024)","id":68},{"number":6,"question":"CP-189 recognizes the following levels of qualification:","options":{"a":"Level I, Level II, and Level III.","b":"trainee, Level I, Level II, and Level III.","c":"trainee, Level I, Level II limited, Level II, and Level III.","d":"trainee, Level I, Level II limited, Level II, Level III, and NDT instructor."},"answer":"d","section":"I","category":"CP-189 (2024)","id":69},{"number":7,"question":"The Level I Practical examination and the Level II Practical examination are similar to those recommended by SNT- TC-1A, with the exception that:","options":{"a":"two test samples must be used for each technique.","b":"two test samples must be used for each different product that will be encountered in their job functions.","c":"the test samples used are to be representative of the products that will be encountered when performing their job functions.","d":"two test samples are to be used for each different product that will be encountered in their job functions."},"answer":"c","section":"I","category":"CP-189 (2024)","id":70},{"number":8,"question":"In CP-189, as a prerequisite, a candidate for the position of an employer’s Level III must hold an ASNT Level III certificate with a currently valid endorsement for each method for which employer certification is sought, and:","options":{"a":"must also satisfactorily complete a Specific examination comprising 15 questions on the employer’s specifications and standards.","b":"must also satisfactorily complete a Specific examination comprising 30 questions on the employer’s specifications and standards for each method.","c":"must also satisfactorily complete a Specific examination comprising 30 questions on the employer’s specifications and standards.","d":"must also satisfactorily complete a Specific examination comprising 15 questions on the employer’s specifications and standards for each method."},"answer":"b","section":"I","category":"CP-189 (2024)","id":71},{"number":9,"question":"Under CP-189, an individual’s certification expires when employment with the employer is terminated or on the last day of the month at the end of five (5) years for Levels I and II. The Level III certification expires:","options":{"a":"when the ASNT Level III certificate has expired.","b":"when the ASNT Level III’s employment with the employer is terminated.","c":"when the ASNT Level III is accused of unethical or incompetent conduct.","d":"when the ASNT Level III retires from employment with the employer."},"answer":"a","section":"I","category":"CP-189 (2024)","id":72},{"number":10,"question":"In accordance with CP-189 (2024), the requirements for an NDT Level III include:","options":{"a":"college degree.","b":"10 years as a Level II.","c":"certification by the employer as a company Level III.","d":"ASNT NDT Level III or PdM Level III certificate."},"answer":"d","section":"I","category":"CP-189 (2024)","id":73},{"number":11,"question":"What is the difference between “calibration” and “standardization” in CP-189 (2024)?","options":{"a":"Calibration is the adjustment of an instrument to a known reference.","b":"Calibration is the adjustment of an instrument to the dead weight tester or master gauge.","c":"Standardization is the adjustment of an instrument to an NIST traceable national standard.","d":"Standardization is the adjustment of an instrument to test blocks supplied by the customer."},"answer":"a","section":"I","category":"CP-189 (2024)","id":74},{"number":12,"question":"How many levels of qualification are there in CP-189 (2024)?","options":{"a":"3","b":"4","c":"5","d":"6"},"answer":"d","section":"I","category":"CP-189 (2024)","id":75},{"number":13,"question":"In accordance with CP-189 (2024), the minimum passing score on the Practical examination is:","options":{"a":"70% following manufacturer’s instructions.","b":"75%.","c":"80%.","d":"85%."},"answer":"c","section":"I","category":"CP-189 (2024)","id":76},{"number":14,"question":"In accordance with CP-189 (2024), the administration and grading of the NDT Level I and NDT Level II multiple- choice examinations may be performed by the:","options":{"a":"NDT Level III only.","b":"NDT Level III or delegate.","c":"NDT Level II.","d":"employer’s quality assurance manager."},"answer":"b","section":"I","category":"CP-189 (2024)","id":77},{"number":15,"question":"What are the requirements for vision examinations in accordance with CP-189 (2024)?","options":{"a":"Jaeger No. 1","b":"Jaeger No. 2","c":"Jaeger No. 2 and color vision","d":"Jaeger No. 1 and color vision"},"answer":"d","section":"I","category":"CP-189 (2024)","id":78},{"number":16,"question":"To be certified as an NDT Level III, what examinations must be administered by the employer in accordance with CP-189 (2024)?","options":{"a":"General, Specific, and Practical exams","b":"Practical exam only","c":"General and Specific exams","d":"Specific and Level II Practical exams"},"answer":"d","section":"I","category":"CP-189 (2024)","id":79},{"number":1,"question":"ASNT NDT Level III certification is a requirement of:","options":{"a":"SNT-TC-1A.","b":"CP-189.","c":"CP-106.","d":"both SNT-TC-1A and CP-189."},"answer":"b","section":"I","category":"ASNT NDT Level III Certification Program","id":80},{"number":2,"question":"A currently valid ASNT NDT Level III certificate indicates:","options":{"a":"an ASNT Level III is authorized to supervise but not perform NDT tasks on behalf of the employer.","b":"the employer can accept a currently valid ASNT NDT Level III certificate as proof of qualification.","c":"an individual is certified in both NDT and PdM.","d":"that the certificate holder has satisfied the Basic and method examination requirements as set forth in SNT-TC-1A."},"answer":"d","section":"I","category":"ASNT NDT Level III Certification Program","id":81},{"number":3,"question":"ASNT NDT Level III certification:","options":{"a":"immediately qualifies a certificate holder to act as the employer’s Level III.","b":"makes an individual potentially eligible to become an employer’s Level III.","c":"permits the individual to function as an independent Level III without further documentation.","d":"only applies when recognized by some requirements document."},"answer":"c","section":"I","category":"ASNT NDT Level III Certification Program","id":82},{"number":4,"question":"The ASNT NDT Level III Basic examination covers all of the following except:","options":{"a":"general knowledge of other NDT test methods.","b":"knowledge of SNT-TC-1A and CP-189 certification programs.","c":"knowledge of materials, fabrication, and production technology.","d":"knowledge of international certification programs."},"answer":"d","section":"I","category":"ASNT NDT Level III Certification Program","id":83},{"number":5,"question":"To recertify by application, an ASNT NDT Level III must:","options":{"a":"demonstrate continued NDT activity and Level III employment.","b":"reexamine prior to their current expiration date.","c":"participate in the ASNT Central Certification Program.","d":"acquire 25 recertification points since the beginning of their NDT employment."},"answer":"a","section":"I","category":"ASNT NDT Level III Certification Program","id":84},{"number":6,"question":"To be eligible to sit for the ASNT NDT Level III examinations, a candidate with two years of passing grades in engineering or science study at a university or technical school must have:","options":{"a":"one additional year of experience beyond the Level II requirements in NDT in an assignment comparable to that of an NDT Level II in the applicable NDT method(s).","b":"two additional years of experience beyond the Level II requirements in NDT in an assignment at least comparable to that of NDT Level II in the applicable NDT method(s).","c":"four years of experience beyond the Level II requirements in NDT in an assignment at least comparable to that of an NDT Level II in the applicable NDT method(s).","d":"one additional year of experience beyond the Level II requirements in NDT in an assignment comparable to that of an NDT Level II and an additional 20 hours of classroom training in the applicable test method(s)."},"answer":"b","section":"I","category":"ASNT NDT Level III Certification Program","id":85},{"number":1,"question":"In AE testing, what is the most common frequency range used for detecting signals?","options":{"a":"10 to 15 kHz","b":"100 to 300 kHz","c":"500 to 750 kHz","d":"1 to 5 MHz"},"answer":"b","section":"II","category":"Acoustic Emission Testing","id":86},{"number":2,"question":"Which type of discontinuity is least likely to be detected by AE testing?","options":{"a":"Leaks","b":"Plastic deformation","c":"Growing cracks","d":"Rounded inclusions"},"answer":"d","section":"II","category":"Acoustic Emission Testing","id":87},{"number":3,"question":"The total energy loss of a propagating wave is called:","options":{"a":"scatter.","b":"dispersion.","c":"diffraction.","d":"attenuation."},"answer":"d","section":"II","category":"Acoustic Emission Testing","id":88},{"number":4,"question":"The Kaiser effect refers to:","options":{"a":"velocity changes due to temperature changes.","b":"low amplitude emissions from aluminum structures.","c":"the behavior where emission from a source will not occur until the previous load is exceeded.","d":"emissions from dissimilar material interfaces."},"answer":"c","section":"II","category":"Acoustic Emission Testing","id":89},{"number":5,"question":"The Felicity effect is useful in evaluating:","options":{"a":"fiber-reinforced plastic components.","b":"high-alloy castings.","c":"large structural steel members.","d":"ceramics."},"answer":"a","section":"II","category":"Acoustic Emission Testing","id":90},{"number":6,"question":"The Kaiser effect is useful in distinguishing:","options":{"a":"electrical noise from mechanical noise.","b":"electrical noise from growing discontinuities.","c":"mechanical noise from growing discontinuities.","d":"electrical noise from continuous emissions."},"answer":"c","section":"II","category":"Acoustic Emission Testing","id":91},{"number":7,"question":"The term “counts” refers to the:","options":{"a":"number of times a signal crosses a preset threshold.","b":"number of events from a source.","c":"number of transducers required to perform a test.","d":"duration of hold periods."},"answer":"a","section":"II","category":"Acoustic Emission Testing","id":92},{"number":8,"question":"The AE signal amplitude is related to:","options":{"a":"the preset threshold.","b":"the intensity of the source.","c":"the bandpass filters.","d":"background noises."},"answer":"b","section":"II","category":"Acoustic Emission Testing","id":93},{"number":9,"question":"Threshold settings are determined by the:","options":{"a":"graininess of the material.","b":"attenuation of the material.","c":"test duration.","d":"background noise level."},"answer":"d","section":"II","category":"Acoustic Emission Testing","id":94},{"number":10,"question":"Background noise can be reduced by:","options":{"a":"electronic filtering.","b":"using flat response amplifiers.","c":"using in-line amplifiers.","d":"using heavier gauge coaxial cable. Electromagnetic Testing Topical Outline 2.2 Electromagnetic Testing (ET) 2.2.1 Sensors 2.2.2 Basic types of equipment, types of readout 2.2.3 Reference standards 2.2.4 Applications and test result interpretation 2.2.4.1 Flaw detection 2.2.4.2 Conductivity and permeability sorting 2.2.4.3 Thickness gauging 2.2.4.4 Process control REFERENCES ASNT, 2014, ASNT Level III Study Guide: Electromagnetic Testing, American Society for Nondestructive Testing, Columbus, OH. ASNT, 2014, ASNT Questions & Answers Book: Electromagnetic Testing, American Society for Nondestructive Testing, Columbus, OH. ASNT, 2004, Nondestructive Testing Handbook, Vol. 5: Electromagnetic Testing, third edition, American Society for Nondestructive Testing, Columbus, OH. ASNT, 2018, Electromagnetic Testing Classroom Training Book (PTP Series), second edition, American Society for Nondestructive Testing, Columbus, OH. ASNT, 2013, Electromagnetic Testing Programmed Instruction Book (PTP Series), second edition, American Society for Nondestructive Testing, Columbus, OH."},"answer":"a","section":"II","category":"Acoustic Emission Testing","id":95},{"number":1,"question":"Eddy currents are circulating electrical currents induced in conductive materials by:","options":{"a":"continuous direct current.","b":"gamma rays.","c":"an alternating magnetic field.","d":"a piezoelectric force."},"answer":"c","section":"II","category":"Electromagnetic Testing","id":96},{"number":2,"question":"The method used to generate eddy currents in a test specimen by means of a coil can most closely be compared with the action of a:","options":{"a":"transformer.","b":"capacitor.","c":"storage battery.","d":"generator."},"answer":"a","section":"II","category":"Electromagnetic Testing","id":97},{"number":3,"question":"ET relies on the principle of:","options":{"a":"magnetostriction.","b":"electromagnetic induction.","c":"piezoelectric energy conversion.","d":"magnetomotive force."},"answer":"b","section":"II","category":"Electromagnetic Testing","id":98},{"number":4,"question":"What happens when the electrical current in an eddy current coil reverses direction?","options":{"a":"The direction of the eddy currents in the test part remains the same.","b":"The eddy currents in the test part will change phase by 45°.","c":"The direction of the eddy currents in the test part also reverses.","d":"The eddy currents in the test part will change phase by 90°."},"answer":"c","section":"II","category":"Electromagnetic Testing","id":99},{"number":5,"question":"In order to generate measurable eddy currents in a test specimen, the specimen must be:","options":{"a":"an electrical conductor.","b":"an electrical insulator.","c":"a ferromagnetic material.","d":"a nonmagnetic material."},"answer":"a","section":"II","category":"Electromagnetic Testing","id":100},{"number":6,"question":"The magnetic field generated by eddy currents induced in a test specimen:","options":{"a":"reinforces the magnetic field that induced the eddy currents.","b":"cancels the magnetic field that induced the eddy currents.","c":"opposes the magnetic field that induced the eddy currents.","d":"has no effect on the magnetic field that induced the eddy currents."},"answer":"c","section":"II","category":"Electromagnetic Testing","id":101},{"number":7,"question":"In ET, what is IACS a recognized abbreviation for?","options":{"a":"Induced Alternating Current System","b":"Inductively Activated Comparison System","c":"Internal Applied Current System","d":"International Annealed Copper Standard"},"answer":"d","section":"II","category":"Electromagnetic Testing","id":102},{"number":8,"question":"In ET, what is the specimen coupled to the test coil by?","options":{"a":"Core coupling","b":"Magnetic saturation","c":"The coil’s electromagnetic fields","d":"Magnetic domains"},"answer":"c","section":"II","category":"Electromagnetic Testing","id":103},{"number":9,"question":"When is the penetration of eddy currents in a conductive material decreased?","options":{"a":"When the test frequency or conductivity of the specimen is decreased.","b":"When the test frequency is decreased or conductivity of the specimen is increased.","c":"When the test frequency, conductivity of the specimen, or permeability of the specimen is increased.","d":"When the permeability of the specimen is decreased."},"answer":"c","section":"II","category":"Electromagnetic Testing","id":104},{"number":10,"question":"At a fixed test frequency, in which of the following materials will the eddy current penetration be greatest?","options":{"a":"Aluminum (35% IACS conductivity)","b":"Brass (15% IACS conductivity)","c":"Copper (95% IACS conductivity)","d":"Lead (7% IACS conductivity)"},"answer":"d","section":"II","category":"Electromagnetic Testing","id":105},{"number":11,"question":"A term used to describe the effect observed due to a change in the coupling between a test specimen and a flat probe coil when the distance of separation between them is varied is:","options":{"a":"liftoff.","b":"fill factor.","c":"edge effect.","d":"end effect."},"answer":"a","section":"II","category":"Electromagnetic Testing","id":106},{"number":12,"question":"When performing eddy current testing, under what condition are discontinuities most easily detected?","options":{"a":"When the eddy currents are coplanar with the major dimension of the discontinuity.","b":"When the eddy currents are perpendicular to the major plane of the discontinuity.","c":"When the eddy currents are parallel to the major dimension of the discontinuity.","d":"When the eddy currents are 90° out of phase with the current in the coil."},"answer":"a","section":"II","category":"Electromagnetic Testing","id":107},{"number":13,"question":"Which of the following discontinuities is easiest to detect with an electromagnetic test? (Assume that the area of the discontinuity is equal in all four choices listed.)","options":{"a":"A subsurface crack which lies parallel to the direction of the eddy current.","b":"A discontinuity located in the center of a 51 mm (2 in.) diameter bar.","c":"A radial crack that extends to the outer surface of a 51 mm (2 in.) diameter bar.","d":"A subsurface radial crack located at a depth of 13 mm (0.5 in.) in a 51 mm (2 in.) diameter bar."},"answer":"c","section":"II","category":"Electromagnetic Testing","id":108},{"number":14,"question":"What is a term used to define the timing relationships involved in alternating current signals?","options":{"a":"Magnitude","b":"Phase","c":"Impedance","d":"Time-gain correction"},"answer":"b","section":"II","category":"Electromagnetic Testing","id":109},{"number":15,"question":"The impedance of a test coil can be represented by the vector sum of:","options":{"a":"inductive reactance and resistance.","b":"capacitive reactance and resistance.","c":"inductive reactance and capacitive reactance.","d":"inductive reactance, capacitive reactance, and resistance."},"answer":"a","section":"II","category":"Electromagnetic Testing","id":110},{"number":16,"question":"What does the term “fill factor” apply to?","options":{"a":"A surface coil","b":"Coaxial cable","c":"An encircling coil","d":"The ability to null an eddy current instrument"},"answer":"c","section":"II","category":"Electromagnetic Testing","id":111},{"number":17,"question":"Which of the following materials would be more likely used as a mounting material for a probe coil?","options":{"a":"Aluminum","b":"Plastic","c":"Copper","d":"Nonferromagnetic steel"},"answer":"b","section":"II","category":"Electromagnetic Testing","id":112},{"number":18,"question":"Which heat exchanger tube material CANNOT be inspected by standard eddy techniques using an internal coil probe?","options":{"a":"Copper","b":"Austenitic stainless steel","c":"Brass","d":"Carbon steel"},"answer":"d","section":"II","category":"Electromagnetic Testing","id":113},{"number":19,"question":"Reference standards used for ET:","options":{"a":"must contain artificial discontinuities such as notches and drilled holes.","b":"must contain natural discontinuities such as cracks and inclusions.","c":"must be free of measurable discontinuities, but may contain artificial or natural discontinuities, or may be free of discontinuities, depending on the test system and the type of test being conducted.","d":"must be constructed from the same material of the object being inspected."},"answer":"c","section":"II","category":"Electromagnetic Testing","id":114},{"number":20,"question":"Which of the following conditions would be the most difficult to detect when testing a rod using an encircling coil?","options":{"a":"A short surface crack that has a depth of 10% of the rod diameter.","b":"A small inclusion in the center of the rod.","c":"A 5% change in diameter.","d":"A 10% change in conductivity."},"answer":"b","section":"II","category":"Electromagnetic Testing","id":115},{"number":21,"question":"The thickness of nonconductive coatings on a conductive base can be most simply measured by:","options":{"a":"observing the liftoff effect caused by the coating.","b":"testing both sides of the specimen.","c":"varying the test frequency over a given range during the test.","d":"using a specially shaped encircling coil."},"answer":"a","section":"II","category":"Electromagnetic Testing","id":116},{"number":22,"question":"Some of the products commonly tested using encircling coils are:","options":{"a":"rods, tubes, and wire.","b":"interior of hollow tubes.","c":"sheets and metal foil.","d":"square billets and plates."},"answer":"a","section":"II","category":"Electromagnetic Testing","id":117},{"number":23,"question":"It is often possible to sort various alloys of a nonmagnetic metal using ET when:","options":{"a":"there is a unique range of permeability values for each alloy.","b":"there is a unique range of conductivity values for each alloy.","c":"the direction of induced eddy currents varies for each alloy.","d":"the magnetic domains for each alloy are different."},"answer":"b","section":"II","category":"Electromagnetic Testing","id":118},{"number":24,"question":"When conducting ET on tubing with a system that includes a frequency discriminating circuit, which of the following variables would be classified as a high- frequency variable?","options":{"a":"Conductivity changes","b":"Diameter changes","c":"Wall thickness variations","d":"Small discontinuities"},"answer":"d","section":"II","category":"Electromagnetic Testing","id":119},{"number":25,"question":"Tubing is generally inspected using:","options":{"a":"U-shaped coils.","b":"gap coils.","c":"encircling coils.","d":"a sliding probe."},"answer":"c","section":"II","category":"Electromagnetic Testing","id":120},{"number":26,"question":"An out-of-phase condition between current and voltage:","options":{"a":"can exist in both the primary and secondary windings of an eddy current coil.","b":"can exist only in the secondary winding of an eddy current coil.","c":"can exist only in the primary winding of an eddy current coil.","d":"exists only in the test specimen."},"answer":"a","section":"II","category":"Electromagnetic Testing","id":121},{"number":27,"question":"For age hardenable aluminum and titanium alloys, changes in hardness are indicated by changes in:","options":{"a":"retentivity.","b":"permeability.","c":"conductivity.","d":"magnetostriction."},"answer":"c","section":"II","category":"Electromagnetic Testing","id":122},{"number":28,"question":"In performing inspection of heat exchanger tubing using an internal differential probe, which type of defect would be difficult to detect?","options":{"a":"Longitudinally oriented crack","b":"Localized corrosion pit","c":"Circumferentially oriented crack","d":"Dent"},"answer":"c","section":"II","category":"Electromagnetic Testing","id":123},{"number":1,"question":"Which of the following systems or components would require the greatest precautions and special considerations when preparing for a leak test?","options":{"a":"Piping and pressure vessels","b":"Refrigeration piping","c":"Vacuum chambers","d":"Sintered material components"},"answer":"d","section":"II","category":"Leak Testing","id":124},{"number":2,"question":"Pressure change leak testing is dependent on three variables. A change to any of these three will have a direct effect on at least one of the other two variables. These three :130},{"number":8,"question":"If the sensitivity of a halogen leak detector remains constant throughout a test, and the pretest and posttest calibrations are acceptable, which of the following conclusions can be made at the end of the test?","options":{"a":"No leaks smaller than a certain size have gone undetected.","b":"The total leakage rate of the test object is less than a certain amount.","c":"The instrument and the test procedure were capable of detecting leakage of a certain size during the test.","d":"The instrument and test procedure were only capable of detecting leakage of a certain size upstream of the tracer gas during the test."},"answer":"c","section":"II","category":"Leak Testing","id":131},{"number":9,"question":"All leak detection techniques are dependent upon:","options":{"a":"barometric pressure.","b":"oxygen content of the surrounding air.","c":"all of the other gases in the mass spectrometer.","d":"establishing a differential pressure across the test boundary."},"answer":"d","section":"II","category":"Leak Testing","id":132},{"number":10,"question":"In high-vacuum systems, the sensitivity of a pressure change leak test depends not only on the observed pressure change but also on the degree of outgassing. Outgassing is best defined as:","options":{"a":"the release of gas from materials in a vacuum.","b":"directly proportional to the temperature of the gas.","c":"the viscosity of the pressurizing gas.","d":"the drop in test pressure due to leakage from the vacuum manifold."},"answer":"a","section":"II","category":"Leak Testing","id":133},{"number":11,"question":"What is the essential information that must be recorded to perform a pressure change leak test?","options":{"a":"Helium concentration, leak response, background","b":"Barometric pressure, start time, stop time, temperature","c":"Temperature, elapsed time, volume, pressure","d":"Mean free path of helium, fluid viscosity, pressure differential"},"answer":"c","section":"II","category":"Leak ll-suited for locating leaks in low-pressure fluid containment vessels (such as low- pressure tanks or piping)?","options":{"a":"Bubble leak testing (soap solution applied over slight pressure or vacuum)","b":"Helium mass spectrometer testing in vacuum mode","c":"Pressure change leak testing","d":"Mass spectrometer leak testing"},"answer":"a","section":"II","category":"Leak Testing","id":140},{"number":18,"question":"What technique is typically used to detect fine leaks in hermetically sealed components (such as electronic packages)?","options":{"a":"Helium mass spectrometer leak testing","b":"Bubble immersion (underwater) leak testing","c":"Halogen diode leak testing","d":"Simple pressure gauge monitoring Liquid Penetrant Testing Topical Outline 2.4 Liquid Penetrant Testing (PT) 2.4.1 Fundamentals 2.4.1.1 Interaction of penetrants and discontinuity openings 2.4.1.2 Fluorescence and contrast 2.4.2 PT 2.4.2.1 Penetrant processes 2.4.2.2 Test equipment and systems factors 2.4.2.3 Test result interpretation, discontinuity indications 2.4.2.4 Applications 2.4.2.4.1 Castings 2.4.2.4.2 Welds 2.4.2.4.3 Wrought metals 2.4.2.4.4 Machined parts 2.4.2.4.5 Leaks 2.4.2.4.6 Field inspections REFERENCES ASNT, 2016, Nondestructive Testing Handbook, Vol. 1: Liquid Penetrant Testing, fourth edition, American Society for Nondestructive Testing, Columbus, OH. ASNT, 1999, Nondestructive Testing Handbook, Vol. 2: Liquid Penetrant Testing, third edition, American Society for Nondestructive Testing, Columbus, OH. ASNT, 2020, Principles and Applications of Liquid Penetrant Testing: A Classroom Training Text, American Society for Nondestructive Testing, Columbus, OH. ASNT, 2005, Liquid Penetrant Testing Classroom Training Book, PTP Series, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Level II Study Guide: Liquid Penetrant Testing Method, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Level III Study Guide: Liquid Penetrant Testing Method, American Society for Nondestructive Testing, Columbus, OH. ASNT, latest edition, ASNT Questions & Answers Book: Liquid Penetrant Testing, American Society for Nondestructive Testing, Columbus, OH."},"answer":"a","section":"II","category":"Leak Testing","id":141},{"number":1,"question":"What is the tendency of a liquid penetrant to enter a discontinuity primarily related to?","options":{"a":"The viscosity of the penetrant","b":"Capillary action","c":"The chemical inertness of the penetrant","d":"The specific gravity of the penetrant"},"answer":"b","section":"II","category":"Liquid Penetrant Testing","id":142},{"number":2,"question":"PT is a nondestructive test method that can be used for:","options":{"a":"locating and evaluating all types of discontinuities in a test specimen.","b":"locating and determining the length, width, and depth of discontinuities in a test specimen.","c":"determining the tensile strength of a test specimen.","d":"locating discontinuities open to the surface."},"answer":"d","section":"II","category":"Liquid Penetrant Testing","id":143},{"number":3,"question":"Which of the following processes is best situated to detect shallow discontinuities?","options":{"a":"Postemulsifiable","b":"Solvent-removable","c":"Aqueous developer","d":"Water-washable"},"answer":"a","section":"II","category":"Liquid Penetrant Testing","id":144},{"number":4,"question":"What is it called when a dye in penetrant materials gives off visible light after being exposed to ultraviolet light?","options":{"a":"Emissivity","b":"Irradiation","c":"Spectrum blocking","d":"Fluorescence"},"answer":"d","section":"II","category":"Liquid Penetrant Testing","id":145},{"number":5,"question":"When using a fluorescent, postemulsifier penetrant, the length of time the emulsifier is allowed to remain on the part is critical for detecting shallow discontinuities. For high viscosity emulsifiers, the optimum dwell time is typically:","options":{"a":"10 seconds.","b":"5 seconds.","c":"determined by experimentation.","d":"2 to 3 minutes."},"answer":"d","section":"II","category":"Liquid Penetrant Testing","id":146},{"number":6,"question":"A red penetrant indication against white background is most likely to be seen when:","options":{"a":"dry developers are used.","b":"visible dye penetrants are used.","c":"fluorescent postemulsified penetrants are used.","d":"ultraviolet light is used with visible dye penetrants."},"answer":"b","section":"II","category":"Liquid Penetrant Testing","id":147},{"number":7,"question":"The most widely accepted technique for removing excess water-washable penetrant from the surface of a test specimen is by:","options":{"a":"using a wet rag.","b":"using a coarse water spray rinse.","c":"washing the part directly under water running from a tap.","d":"immersing the part in water."},"answer":"b","section":"II","category":"Liquid Penetrant Testing","id":148},{"number":8,"question":"Which of the following PT systems is generally considered the least sensitive?","options":{"a":"Water-washable; visible dye","b":"Solvent-removable; visible dye","c":"Water-washable; fluorescent dye","d":"Postemulsified; visible dye"},"answer":"a","section":"II","category":"Liquid Penetrant Testing","id":149},{"number":9,"question":"When performing PT using solvent-removable visible dye penetrant, there are several ways to remove excess penetrant from the surface of the part. Which of the techniques is generally regarded as most suitable for giving accurate test results?","options":{"a":"Squirting solvent over the surface with no more than 69 kPa (10 psi) pressure.","b":"Wiping with a solvent-soaked cloth, then wiping with a dry cloth.","c":"Wiping with a solvent-dampened cloth, then wiping with dry cloths.","d":"Wiping with dry cloths, then wiping with a solvent- dampened cloth, and finally wiping with a dry cloth."},"answer":"d","section":"II","category":"Liquid Penetrant Testing","id":150},{"number":10,"question":"A problem with retesting a specimen that has been previously tested using PT is that the:","options":{"a":"penetrant residue left in discontinuities may not readily dissolve, and the retest may be misleading.","b":"penetrant may form beads on the surface.","c":"penetrant will lose a great deal of its color brilliance.","d":"added penetrant will intensify the penetrant residue, making indications larger than normal."},"answer":"a","section":"II","category":"Liquid Penetrant Testing","id":151},{"number":11,"question":"A commonly used method of checking the overall performance of a liquid penetrant material system is to:","options":{"a":"determine the viscosity of the penetrant.","b":"measure the wettability of the penetrant.","c":"compare two sections of artificially cracked specimens.","d":"check the penetrant contaminant levels."},"answer":"c","section":"II","category":"Liquid Penetrant Testing","id":152},{"number":12,"question":"The function of emulsifier in the postemulsified penetrant process is to:","options":{"a":"influence the rate of penetration into deep, tight cracks.","b":"react with the surface penetrant to make the penetrant water washable.","c":"add fluorescent dye or pigment to the penetrant.","d":"emulsify surface oils and greases to facilitate their removal."},"answer":"b","section":"II","category":"Liquid Penetrant Testing","id":153},{"number":13,"question":"Which of the following statements most applies to developers used during PT?","options":{"a":"Developers are normally highly fluorescent.","b":"Some developers create a fluctuating background during inspection.","c":"Developers absorb or blot the penetrant that remains in discontinuities after the excess penetrant has been removed.","d":"Nonaqueous developers are better suited for very humid environments."},"answer":"c","section":"II","category":"Liquid Penetrant Testing","id":154},{"number":14,"question":"The penetrant indication for a cold shut on the surface of a casting will normally be:","options":{"a":"a dotted line.","b":"a large bulbous indication.","c":"a smooth continuous line.","d":"undetectable since cold shuts are closed over on the surface."},"answer":"c","section":"II","category":"Liquid Penetrant Testing","id":155},{"number":15,"question":"A crack-type discontinuity will generally appear as:","options":{"a":"a rounded indication.","b":"a continuous line, either straight or jagged.","c":"a broad, fuzzy indication.","d":"random round or elongated holes."},"answer":"b","section":"II","category":"Liquid Penetrant Testing","id":156},{"number":16,"question":"In PT, scattered round indications on the surface of a part could indicate:","options":{"a":"fatigue cracks.","b":"porosity.","c":"weld laps.","d":"hot tears."},"answer":"b","section":"II","category":"Liquid Penetrant Testing","id":157},{"number":17,"question":"Which of the following are typical nonrelevant indications found in PT?","options":{"a":"Indications due to part geometry or part design configurations.","b":"Nonmagnetic indications.","c":"Indications due to contact with another test object.","d":"Indications on low-stressed areas of the part."},"answer":"a","section":"II","category":"Liquid Penetrant Testing","id":158},{"number":18,"question":"Which of the statements best states the effects of sandblasting for the cleaning of surfaces to be tested with PT?","options":{"a":"Surface discontinuities may be closed.","b":"Oil contaminants might be sealed in the discontinuities.","c":"The sand used in the sandblasting operation may be forced into the discontinuity.","d":"The sandblasting operation may introduce discontinuities into the part."},"answer":"a","section":"II","category":"Liquid Penetrant Testing","id":159},{"number":19,"question":"The penetrant indication of a forging lap will normally be a:","options":{"a":"round or nearly round indication.","b":"cluster of indications.","c":"thin continuous line.","d":"dotted line."},"answer":"c","section":"II","category":"Liquid Penetrant Testing","id":160},{"number":20,"question":"Aluminum alloy test specimens that have been tested with PT should be thoroughly cleaned after testing because:","options":{"a":"acid in the penetrant may cause severe corrosion.","b":"the oily residue from the test will severely inhibit the application of paint on aluminum alloys.","c":"a chemical reaction between the penetrant and aluminum could cause a fire.","d":"the alkalines in wet developers and most emulsifiers could cause surface pitting, particularly in moist atmospheres."},"answer":"d","section":"II","category":"Liquid Penetrant Testing","id":161},{"number":21,"question":"Which of the following is a discontinuity that might be found in rolled bar stock?","options":{"a":"Blow holes","b":"Shrinkage laps","c":"Stringers or seams","d":"Insufficient penetration"},"answer":"c","section":"II","category":"Liquid Penetrant Testing","id":162},{"number":22,"question":"Anodized surfaces are usually considered poor candidates for high-sensitivity PT because the anodizing process produces a conversion layer that:","options":{"a":"is extremely smooth and slick.","b":"has a multitude of extremely small pores.","c":"may have alkaline residue that “quenches” the penetrant.","d":"cannot be cleaned by ordinary processes."},"answer":"b","section":"II","category":"Liquid Penetrant Testing","id":163},{"number":23,"question":"Which PT technique is best suited for performing inspections without electricity?","options":{"a":"Water-washable fluorescent penetrant","b":"Postemulsified fluorescent penetrant","c":"Visible dye penetrant","d":"Hydrophilic fluorescent penetrant"},"answer":"c","section":"II","category":"Liquid Penetrant Testing","id":164},{"number":24,"question":"Which statement is true concerning PT of welds with rough surfaces?","options":{"a":"The postemulsified process offers advantages over the water-washable process.","b":"If the solvent-removal process is used, the best developer would be an aqueous suspension.","c":"Welds with rough surfaces cannot be successfully tested by any PT technique.","d":"Welds with rough surfaces may need to be ground smooth prior to PT."},"answer":"a","section":"II","category":"Liquid Penetrant Testing","id":165},{"number":25,"question":"A penetrant must:","options":{"a":"change viscosity in order to spread over the surface of the part.","b":"spread easily over the surface of the material.","c":"have a low flash point.","d":"be able to change color in order to fluoresce."},"answer":"b","section":"II","category":"Liquid Penetrant Testing","id":166},{"number":26,"question":"Which of the following is an example of an in-service discontinuity?","options":{"a":"Grinding cracks","b":"Porosity","c":"Stress-corrosion crack","d":"Cold lap"},"answer":"c","section":"II","category":"Liquid Penetrant Testing","id":167},{"number":27,"question":"Penetrant materials are tested and qualified to what specification?","options":{"a":"AMS 2642","b":"AMS 2644","c":"AMS 2646","d":"AMS 2648"},"answer":"b","section":"II","category":"Liquid Penetrant Testing","id":168},{"number":28,"question":"Which of the following penetrants can be removed with water?","options":{"a":"Method A penetrant","b":"Method B penetrant","c":"Method C penetrant","d":"Method D penetrant"},"answer":"a","section":"II","category":"Liquid Penetrant Testing","id":169},{"number":29,"question":"Fluorescent dye penetrant is typically which color?","options":{"a":"Red","b":"Yellow-green","c":"Orange","d":"Blue"},"answer":"b","section":"II","category":"Liquid Penetrant Testing","id":170},{"number":30,"question":"In performing field penetrant inspection of structural steel welds that have been exposed to atmospheric conditions for an extended period of time, which of the following is an important consideration when inspecting for fatigue cracks?","options":{"a":"Temperature of the weld surface","b":"The crack may be oxide filled which would prevent penetration of the penetrant.","c":"Wind conditions","d":"Orientation of the crack"},"answer":"b","section":"II","category":"Liquid Penetrant Testing","id":171},{"number":1,"question":"In MFL inspection for discontinuities using an active field, the part being inspected should be magnetized:","options":{"a":"beyond saturation.","b":"near the point of maximum permeability.","c":"to saturation or near saturation.","d":"well below saturation."},"answer":"c","section":"II","category":"Magnetic Flux Leakage Testing","id":172},{"number":2,"question":"An advantage that MFL testing has in comparison with electromagnetic testing is that MFL is:","options":{"a":"less sensitive to interferences caused by surface roughness.","b":"useful on products at temperatures above the Curie point.","c":"useful on austenitic steels.","d":"easier to use on ferromagnetic materials."},"answer":"d","section":"II","category":"Magnetic Flux Leakage Testing","id":173},{"number":3,"question":"What type of discontinuity would NOT typically be indicated by MFL techniques?","options":{"a":"Laps","b":"Pitting accompanied by cracking.","c":"Deep-surface discontinuities","d":"Longitudinal seams"},"answer":"c","section":"II","category":"Magnetic Flux Leakage Testing","id":174},{"number":4,"question":"The strength of the magnetic field in the interior of a coil is determined by the:","options":{"a":"number of turns in the coil only.","b":"strength of applied current only.","c":"number of turns in the coil and the strength of the applied current.","d":"direction of applied current in the coil."},"answer":"c","section":"II","category":"Magnetic Flux Leakage Testing","id":175},{"number":5,"question":"The current used for magnetization when performing an MFL inspection must be a:","options":{"a":"steady nonfluctuating current.","b":"current that reverses direction at an inconsistent rate.","c":"current that fluctuates on and off at a consistent rate.","d":"current that varies based on the thickness of the material."},"answer":"a","section":"II","category":"Magnetic Flux Leakage Testing","id":1 and applied current.","c":"strength of magnetism and alignment of domains within material.","d":"magnetic flux density and the current generated."},"answer":"a","section":"II","category":"Magnetic Flux Leakage Testing","id":182},{"number":12,"question":"When inspecting wire rope, a magnetic flux loop is used to monitor:","options":{"a":"broken external wires.","b":"broken internal wires.","c":"changes in inspection speed.","d":"reductions in cross-sectional area."},"answer":"d","section":"II","category":"Magnetic Flux Leakage Testing","id":183},{"number":13,"question":"What does a Hall effect probe measure?","options":{"a":"Permeability","b":"Conductivity","c":"Flux density perpendicular to the probe surface","d":"Tangential field strength"},"answer":"c","section":"II","category":"Magnetic Flux Leakage Testing","id":184},{"number":14,"question":"The direction of magnetic lines of force are generally considered to be _____ from the direction of current flow.","options":{"a":"45°","b":"90°","c":"180°","d":"270°"},"answer":"b","section":"II","category":"Magnetic Flux Leakage Testing","id":185},{"number":15,"question":"If an MFL sensor bounces along the surface of aboveground storage tanks, it may:","options":{"a":"make it difficult to estimate the severity of an indication.","b":"generate noise in the signal.","c":"decrease the speed of the inspection.","d":"distort the magnetizing system."},"answer":"b","section":"II","category":"Magnetic Flux Leakage Testing","id":186},{"number":16,"question":"In an MFL examination of aboveground storage tanks, which factor(s) must be considered when interpreting an indication?","options":{"a":"Signal amplitude only","b":"Signal width only","c":"Visual and ultrasonic evaluation","d":"Signal amplitude and width"},"answer":"c","section":"II","category":"Magnetic Flux Leakage Testing","id":187},{"number":17,"question":"For pipe body inspection using MFL, longitudinal magnetization is best for detection of:","options":{"a":"longitudinal
