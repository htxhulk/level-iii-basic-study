"id":380,"reference":"[4.1.3]"},{"number":5,"question":"Typically, the highest quality of steel is produced in:","options":{"a":"an electric furnace.","b":"an open-hearth furnace.","c":"a Bessemer furnace.","d":"a basic oxygen furnace."},"answer":"a","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":381,"reference":"[4.1.3]"},{"number":6,"question":"By which of the following processes is most of the world’s steel produced?","options":{"a":"Bessemer converter","b":"Electric furnace","c":"Open hearth","d":"Basic oxygen furnace"},"answer":"d","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":382,"reference":"[4.1.3]"},{"number":7,"question":"What percentage of carbon is found in steel?","options":{"a":"Between 3 and 4%","b":"Between 2 and 3%","c":"Less than 0.2%","d":"Less than 2%"},"answer":"d","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":383,"reference":"[4.1.6]"},{"number":8,"question":"A steel with 40 points of carbon contains:","options":{"a":"40% carbon.","b":"4% carbon.","c":"0.4% carbon.","d":"0.04% carbon."},"answer":"c","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":384,"reference":"[4.1.6]"},{"number":9,"question":"Low-carbon steel contains approximately:","options":{"a":"0.6 to 2.5% carbon.","b":"0.06 to 0.25% carbon.","c":"0.5 to 1.6% carbon.","d":"5 to 16% carbon."},"answer":"b","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":385,"reference":"[4.1.6]"},{"number":10,"question":"Which of the following is true relative to the comparison of the properties of aluminum-based alloys and iron-based alloys?","options":{"a":"Iron has a lower melting point than aluminum.","b":"Iron can exist in several different crystalline structures, and its properties can be controlled by heat treatment.","c":"Iron can be alloyed to increase its strength, whereas aluminum is strongest in its pure state.","d":"Iron is preferred in load-carrying designs, but it should not be used for any deformation-type of manufacturing process."},"answer":"b","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":386,"reference":"[4.1.8]"},{"number":11,"question":"Corrosion-resistant steels having relatively high percentages of nickel and chromium are called:","options":{"a":"wrought iron.","b":"low-alloy steels.","c":"stainless steels.","d":"nonferrous steels."},"answer":"c","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":387,"reference":"[4.1.8]"},{"number":12,"question":"Austenitic stainless steels are paramagnetic; this means that:","options":{"a":"alternating current must be used when using the magnetic particle testing method.","b":"the steel is very dense and, relative to other steels, difficult to penetrate with X-rays.","c":"ultrasonic testing is the logical NDT method to choose because of the coarse-grained nature of paramagnetic material.","d":"the material has a very low magnetic permeability."},"answer":"d","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":388,"reference":"[4.1.8]"},{"number":13,"question":"Which of the following is an advantage of cast steel over wrought steels?","options":{"a":"Cast steels usually have higher mechanical properties than wrought steels.","b":"Cast steels have more isotropic properties than wrought steels.","c":"Cast steels are more corrosion-resistant than wrought steels.","d":"Cast steels cannot be heat treated and are thus less expensive to produce than wrought steels."},"answer":"b","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":389,"reference":"[4.1.10]"},{"number":14,"question":"Which of the following nonferrous metals is the most important structural material?","options":{"a":"Copper alloys","b":"Nickel alloys","c":"Zinc alloys","d":"Aluminum alloys"},"answer":"d","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":390},{"number":15,"question":"Many metals exhibit an increase in strength caused by plastic flow beyond the elastic limit. This effect is called:","options":{"a":"twinning.","b":"plastic deformation.","c":"work hardening.","d":"age hardening."},"answer":"c","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":391},{"number":16,"question":"The heat treatment of aluminum for the purpose of hardening and strengthening:","options":{"a":"is not possible with aluminum alloys because they contain no carbon and cannot undergo allotropic changes.","b":"can produce tensile strengths equivalent to some carbon steels.","c":"requires the use of special furnaces and is rarely done as a practical application.","d":"requires that iron and carbon be alloyed for the best results."},"answer":"b","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":392},{"number":17,"question":"Brass and bronze are alloys of zinc, tin, and a large percentage of:","options":{"a":"beryllium.","b":"copper.","c":"lead.","d":"nickel."},"answer":"b","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":393},{"number":18,"question":"Monel™ and Inconel™ are:","options":{"a":"nickel alloys.","b":"steel alloys.","c":"magnesium alloys.","d":"aluminum alloys."},"answer":"a","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":394,"reference":"[4.4.3; Table 4.12]"},{"number":19,"question":"Which of the following metals has a density approximately two-thirds that of aluminum?","options":{"a":"Magnesium","b":"Iron","c":"Copper","d":"Nickel [4.2.1]"},"answer":"a","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":395,"reference":"[4.7.1]"},{"number":20,"question":"A high-strength, low-density, corrosion-resistant metal alloy of significance in the aircraft, marine, and chemical processing industries is:","options":{"a":"tungsten.","b":"zinc.","c":"titanium.","d":"magnesium. [4.2.2]"},"answer":"c","section":"III","category":"Ch. 4: Production and Properties of Common Metals","id":396,"reference":"[4.8]"},{"number":1,"question":"Which of the following statements is true concerning plastics following their initial polymerization?","options":{"a":"Thermoplastics can be endlessly reshaped.","b":"Thermosetting plastics do not soften, but char and deteriorate when reheated.","c":"All plastics are synthetic and contain no natural materials.","d":"Plastics have a complex molecular structure, making it expensive to bind with other materials. [4.2.4]"},"answer":"b","section":"III","category":"Ch. 5: Polymers, Ceramics, and Composites","id":397,"reference":"[5.1.1.2]"},{"number":2,"question":"Based on the strength-to-weight ratio:","options":{"a":"no plastic materials can compare with metals.","b":"plastics, as a group, are superior in strength to most ferrous metals.","c":"some plastics, including nylon, may have strengths greater than some steels.","d":"plastics, being chemically inert, retain their strength longer than carbon steels in corrosive environments."},"answer":"c","section":"III","category":"Ch. 5: Polymers, Ceramics, and Composites","id":398,"reference":"[5.1.2]"},{"number":3,"question":"Which of the following statements is true regarding plastics processing?","options":{"a":"Unlike metals, plastics must be processed without the addition of heat.","b":"All plastic-molding processes use liquid-state materials introduced into the mold cavity.","c":"Injection molding can be done only with thermosetting materials.","d":"Both thermoplastics and thermosetting plastics may be processed by molding, casting, and extrusion."},"answer":"d","section":"III","category":"Ch. 5: Polymers, Ceramics, and Composites","id":399,"reference":"[5.1.3]"},{"number":4,"question":"Reinforced plastic molding involves the use of:","options":{"a":"thermosetting plastics and fibrous reinforcement materials.","b":"thermosetting plastics and metallic powder reinforcement.","c":"thermoplastics and wood fiber reinforcement materials.","d":"thermoplastics and metallic powder reinforcement."},"answer":"a","section":"III","category":"Ch. 5: Polymers, Ceramics, and Composites","id":400,"reference":"[5.1.3.5]"},{"number":5,"question":"The major difference between materials classified as “composites” and those classified as “mixtures” is that:","options":{"a":"composites contain metallic constituents and mixtures are nonmetallic.","b":"mixtures start as liquids blended together and composites start as solids.","c":"mixtures are elastomeric, whereas composites are characterized as having at least one plastic component.","d":"mixtures are a type of composite with random orientation and shape of the constituents."},"answer":"d","section":"III","category":"Ch. 5: Polymers, Ceramics, and Composites","id":401,"reference":"[5.2.1]"},{"number":6,"question":"Which of the following statements is true concerning composite materials?","options":{"a":"Composite materials are engineered from one or more reinforcing agents and a matrix to increase strength and reduce weight.","b":"When composite materials are cured, the constituents lose their original identity and form chemical compounds with one another.","c":"A unique feature of composite materials is that their tensile strength frequently exceeds the strength of the strongest constituent.","d":"Composites are usually formed into complex three-dimensional shapes with each dimension approximately equal to the other two."},"answer":"a","section":"III","category":"Ch. 5: Polymers, Ceramics, and Composites","id":402,"reference":"[5.3]"},{"number":7,"question":"Which of the following materials is typically considered when the application requires high compressive strength?","options":{"a":"Glass fibers","b":"Aramid fibers","c":"Carbon fibers","d":"Ceramic fibers"},"answer":"c","section":"III","category":"Ch. 5: Polymers, Ceramics, and Composites","id":403,"reference":"[5.3.3.2]"},{"number":8,"question":"Which of the following statements is true concerning honeycomb?","options":{"a":"The function of a honeycomb core is to lighten, stiffen, and strengthen by utilizing the “sandwich principle.”","b":"In honeycomb, the walls of the cellular core material are aligned parallel with the plane of the face sheets.","c":"Honeycomb containing nonmetallic elements can be bonded by adhesives, brazing, or diffusion welding.","d":"Honeycomb combining metallic and nonmetallic elements cannot be used in cryogenic service due to the permeability of the nonmetallic elements."},"answer":"a","section":"III","category":"Ch. 5: Polymers, Ceramics, and Composites","id":404,"reference":"[5.3.5]"},{"number":9,"question":"The mechanism of adhesion may combine mechanical interlocking with:","options":{"a":"stickiness of the adhesive.","b":"roughness of the adherends.","c":"dynamic mechanical forces.","d":"cohesion."},"answer":"d","section":"III","category":"Ch. 5: Polymers, Ceramics, and Composites","id":405,"reference":"[5.3.6.2]"},{"number":10,"question":"Which of the following tests uses a pendulum to break a specimen that is notched and supported on both ends, with the result of measuring energy absorption?","options":{"a":"Creep test","b":"Charpy test","c":"Fatigue test","d":"Transverse rupture test"},"answer":"b","section":"III","category":"Ch. 5: Polymers, Ceramics, and Composites","id":406},{"number":1,"question":"The design of the casting is important because the quality of the finished product can be adversely affected by:","options":{"a":"liquid metal pour volume, gate locations, and nonuniform casting sections.","b":"mold temperature, slow postcasting cooling, and magnetization.","c":"riser baffles, pour cup angle, and mold parting lines.","d":"alloy element segregation, change in metal phase, and sprue spacing."},"answer":"a","section":"III","category":"Ch. 6: Casting","id":407},{"number":2,"question":"The part of the casting where the gate or riser attaches:","options":{"a":"is the area used to establish reference standards for cast materials.","b":"provides the best quality material because of rapid cooling in this area.","c":"may provide a concentration point for discontinuities.","d":"is designed to create nonuniform section thicknesses."},"answer":"b","section":"III","category":"Ch. 6: Casting","id":408},{"number":3,"question":"Risers, feeders, or feed heads in castings serve to provide sources of molten metal to compensate for:","options":{"a":"misruns.","b":"cold shuts.","c":"dendritic grain growth.","d":"shrinkage."},"answer":"d","section":"III","category":"Ch. 6: Casting","id":409},{"number":4,"question":"Which of the following may cause a discontinuity even though its intended purpose is to prevent shrinkage cavities by absorbing heat from the molten metal in the center of the casting?","options":{"a":"Riser","b":"Internal chill","c":"Core","d":"Chaplet [5.3.7.2]"},"answer":"b","section":"III","category":"Ch. 6: Casting","id":410,"reference":"[6.1.1.5]"},{"number":5,"question":"In a casting, shrinkage occurs:","options":{"a":"only after the transformation from liquid to solid.","b":"only during the transformation from liquid to solid.","c":"before, during, and after the transformation from liquid to solid.","d":"only when the metal is in the liquid state."},"answer":"c","section":"III","category":"Ch. 6: Casting","id":411,"reference":"[6.1.2.2]"},{"number":6,"question":"Large voids or porosity in a casting result from:","options":{"a":"turbulent flow of the molten metal during pouring.","b":"alloy element segregation.","c":"molten metal boiling because of superheat.","d":"gas evolution before and during solidification."},"answer":"d","section":"III","category":"Ch. 6: Casting","id":412,"reference":"[6.1.2.2]"},{"number":7,"question":"During the solidification of a casting, the shrinkage that occurs:","options":{"a":"may cause cavities that are enlarged by the evolution of gases.","b":"may cause porosity and shrinkage cavities primarily in the outer surfaces where the metal cools first.","c":"requires that the pattern used be slightly smaller than the desired dimension of the finished casting.","d":"may be eliminated by investment casting."},"answer":"a","section":"III","category":"Ch. 6: Casting","id":413,"reference":"[6.1.2.2]"},{"number":8,"question":"A casting process used to produce elongated shapes by drawing solidified metal from a water-cooled mold backed by molten metal is: [6.1.1.4]","options":{"a":"centrifugal casting.","b":"continuous casting.","c":"draw casting.","d":"extrusion."},"answer":"b","section":"III","category":"Ch. 6: Casting","id":414,"reference":"[6.2.1]"},{"number":9,"question":"Green sand-casting molds include:","options":{"a":"sand, clay, and water.","b":"sand, wax, and solvent.","c":"sand, refractory metals, and water.","d":"sand, carbon, and green clay."},"answer":"a","section":"III","category":"Ch. 6: Casting","id":415,"reference":"[6.2.2.2]"},{"number":10,"question":"Which of the following NDT methods can be commonly used to inspect castings for unfused chaplets and to determine that all the core materials have been removed?","options":{"a":"Ultrasonic testing","b":"Magnetic particle testing","c":"Radiographic testing","d":"Electromagnetic testing"},"answer":"c","section":"III","category":"Ch. 6: Casting","id":416,"reference":"[6.2.2.6]"},{"number":11,"question":"Mold material in the form of inserts that exclude metal flow and thus form internal surfaces or passages in a casting are called:","options":{"a":"chills.","b":"chaplets.","c":"cores.","d":"patterns."},"answer":"c","section":"III","category":"Ch. 6: Casting","id":417,"reference":"[6.2.2.6]"},{"number":12,"question":"Small metal supports used to support and position cores become part of a casting by fusing with the molten metal. Such devices are called:","options":{"a":"core hangers.","b":"chills.","c":"risers.","d":"chaplets."},"answer":"d","section":"III","category":"Ch. 6: Casting","id":418,"reference":"[6.2.2.6]"},{"number":13,"question":"Casting molds made by covering a heated metal pattern with sand that is mixed with particles of thermosetting plastic are called:","options":{"a":"green sand molds.","b":"shell molds.","c":"die casting molds.","d":"permanent molds."},"answer":"b","section":"III","category":"Ch. 6: Casting","id":419,"reference":"[6.2.2.10]"},{"number":14,"question":"Another term for “precision casting” and the “lost-wax process” is:","options":{"a":"investment casting.","b":"die casting.","c":"metal mold casting.","d":"shell mold casting."},"answer":"a","section":"III","category":"Ch. 6: Casting","id":420,"reference":"[6.2.4]"},{"number":15,"question":"Permanent molds are most frequently made of:","options":{"a":"ceramics.","b":"fused sand and plastic.","c":"metal.","d":"plaster."},"answer":"c","section":"III","category":"Ch. 6: Casting","id":421,"reference":"[6.2.6]"},{"number":16,"question":"A casting process used to produce hollow products like large pipes and hollow shafts is:","options":{"a":"investment casting.","b":"blow casting.","c":"core casting.","d":"centrifugal casting."},"answer":"d","section":"III","category":"Ch. 6: Casting","id":422,"reference":"[6.2.7]"},{"number":17,"question":"Which of the following metals has low strength and high corrosion resistance, and is used largely in die-casting operations?","options":{"a":"Zinc","b":"Aluminum","c":"Magnesium","d":"Manganese"},"answer":"a","section":"III","category":"Ch. 6: Casting","id":423,"reference":"[6.2.8]"},{"number":18,"question":"Which of the following is true regarding solidification of molten metal in a casting mold?","options":{"a":"The metal cools at a constant rate, thus providing fine equiaxed grains throughout.","b":"Cooling takes place in phases having different rates that produce different types of grain structure in different sections of the casting.","c":"Solidification occurs at a constant rate, beginning at the interior of the casting and progressing outward.","d":"Thick sections tend to cool more rapidly than thin sections because thin sections consist mostly of fine equiaxed grains."},"answer":"b","section":"III","category":"Ch. 6: Casting","id":424,"reference":"[6.3.2]"},{"number":19,"question":"The term used to describe a discontinuity in a casting that occurs when molten metal interfaces with already solidified metal with failure to fuse at the interface is:","options":{"a":"hot tear.","b":"cold shut.","c":"inclusion.","d":"segregation."},"answer":"b","section":"III","category":"Ch. 6: Casting","id":425},{"number":1,"question":"The advantages of deformation of metals as a manufacturing process are:","options":{"a":"consistent duplication, fast production, low cost for high volumes.","b":"low tooling cost, less NDT, doesn’t require heat treatment.","c":"easier to recycle, better grain structure, doesn’t require special materials.","d":"more labor, only makes simple shapes, holds finishes well."},"answer":"a","section":"III","category":"Ch. 7: Metal Forming","id":426},{"number":2,"question":"Which of the following would have the least ductility?","options":{"a":"Cold-rolled steel plate","b":"Hot-rolled steel plate","c":"Cast iron","d":"Hot-rolled aluminum plate"},"answer":"c","section":"III","category":"Ch. 7: Metal Forming","id":427},{"number":3,"question":"Forged products invariably exhibit:","options":{"a":"high susceptibility to corrosion.","b":"lower strength than their cast counterparts.","c":"directional properties.","d":"poor weldability."},"answer":"c","section":"III","category":"Ch. 7: Metal Forming","id":428},{"number":4,"question":"The manufacturing process used most to form metals into three-dimensional shapes is:","options":{"a":"casting.","b":"machining.","c":"welding.","d":"forging."},"answer":"d","section":"III","category":"Ch. 7: Metal Forming","id":429},{"number":5,"question":"Which of the following product forms is generally selected for high strength and controlled property directionality?","options":{"a":"Castings","b":"Forgings","c":"Extrusions","d":"Hot-rolled flat stock [7.2.1]"},"answer":"b","section":"III","category":"Ch. 7: Metal Forming","id":430,"reference":"[6.4.3]"},{"number":6,"question":"NDT is often used on products intended for secondary operations to:","options":{"a":"ensure that further operations are not performed on material that contains discontinuities that could cause rejection of the manufactured part.","b":"determine that discontinuities do not exist in the material that could damage the rolling mills and other equipment.","c":"determine the ductility of the material after the rolling operation is complete.","d":"accurately determine the compressive strength of the material after it passes through the rolling mill. [7.2.1.1]"},"answer":"a","section":"III","category":"Ch. 7: Metal Forming","id":431,"reference":"[7.2]"},{"number":7,"question":"An NDT method best suited to locating discontinuities caused by inclusions rolled into steel plate is:","options":{"a":"radiographic testing.","b":"ultrasonic testing.","c":"visual testing.","d":"magnetic particle testing. [7.2.1.1]"},"answer":"b","section":"III","category":"Ch. 7: Metal Forming","id":432,"reference":"[7.2]"},{"number":8,"question":"Slabs, blooms, and billets are:","options":{"a":"the shapes that an ingot is rolled into prior to a variety of secondary operations.","b":"the three consecutive stages that the metal goes through during the production of products such as angle iron and channel iron.","c":"types of discontinuities that occur during the hot rolling of steel.","d":"the three different shapes produced during typical cold-rolling operations. [7.2.2.1]"},"answer":"a","section":"III","category":"Ch. 7: Metal Forming","id":433,"reference":"[7.2.1]"},{"number":9,"question":"Before cold-finishing operations can be done on hot-rolled materials, cleaning is often performed by immersing the hot-rolled material in acid baths in a process called:","options":{"a":"degreasing.","b":"descaling.","c":"pickling.","d":"anodizing."},"answer":"c","section":"III","category":"Ch. 7: Metal Forming","id":434,"reference":"[7.2.2.1]"},{"number":10,"question":"During the steelmaking process, a large number of discontinuities such as slag, porosity, and shrinkage cavities exist in the top of the ingot. These discontinuities are:","options":{"a":"mostly eliminated in subsequent hot working due to the pressure that “welds” the void shut.","b":"located with NDT at later stages of production.","c":"almost nonexistent with modern steelmaking processes.","d":"removed by cropping up to one-third off the top of the ingot."},"answer":"d","section":"III","category":"Ch. 7: Metal Forming","id":435,"reference":"[7.2.2.1]"},{"number":11,"question":"Discontinuities with their origin in the original ingot can be reduced in severity by the closing and welding of voids and the breaking up and elongation of inclusions by which of the following processes?","options":{"a":"Cold working","b":"Hot rolling","c":"Heat treatment","d":"Welding"},"answer":"b","section":"III","category":"Ch. 7: Metal Forming","id":436,"reference":"[7.2.2.1]"},{"number":12,"question":"Cold-rolling sheet steel usually begins with a material that:","options":{"a":"has been completely inspected with an automated radiographic system.","b":"has been previously hot rolled to dimensions close to the size of the finished product.","c":"has less ductility and greater hardness than typical hot-rolled steel.","d":"will have a lower yield and tensile strength after cold working."},"answer":"b","section":"III","category":"Ch. 7: Metal Forming","id":437,"reference":"[7.2.2.2]"},{"number":13,"question":"Which of the following statements is true concerning deformation processes?","options":{"a":"Hot working usually follows cold working.","b":"Hot working must be followed by heat treatment.","c":"Cold working usually follows hot working.","d":"Cold working renders brittle material more ductile."},"answer":"c","section":"III","category":"Ch. 7: Metal Forming","id":438,"reference":"[7.2.2.2]"},{"number":14,"question":"Machinability and fatigue resistance are improved in most metals that have been:","options":{"a":"hot worked.","b":"cold worked.","c":"heat treated.","d":"cast."},"answer":"b","section":"III","category":"Ch. 7: Metal Forming","id":439,"reference":"[7.2.2.2]"},{"number":15,"question":"The manufacturing process performed principally on flat products and bars that improves hardness, strength, surface finish, and dimensional accuracy is:","options":{"a":"cold rolling.","b":"hot rolling.","c":"forging.","d":"sintering."},"answer":"a","section":"III","category":"Ch. 7: Metal Forming","id":440,"reference":"[7.2.2.2]"},{"number":16,"question":"Most seamless tubing made without welds is processed by:","options":{"a":"casting.","b":"piercing.","c":"cold rolling.","d":"brazing."},"answer":"b","section":"III","category":"Ch. 7: Metal Forming","id":441,"reference":"[7.2.2.2]"},{"number":17,"question":"With flat products such as cold-rolled strip and sheet, ultrasonic and radiation gauges may be used to provide an accurate measurement of:","options":{"a":"strain rate.","b":"surface roughness.","c":"thermal properties.","d":"thickness."},"answer":"d","section":"III","category":"Ch. 7: Metal Forming","id":442,"reference":"[7.2.2.2]"},{"number":18,"question":"Most steel pipe is produced by forming and:","options":{"a":"drawing.","b":"welding.","c":"forging.","d":"pressing."},"answer":"b","section":"III","category":"Ch. 7: Metal Forming","id":443},{"number":19,"question":"A process that requires the use of large, powerful equipment that forms ductile material into a wide variety of long-length, uniform, cross-sectional shapes best describes:","options":{"a":"forging.","b":"powder metallurgy.","c":"extrusion.","d":"die casting."},"answer":"c","section":"III","category":"Ch. 7: Metal Forming","id":444},{"number":20,"question":"Among other factors, the advantageous effects of recrystallization depend upon the:","options":{"a":"rate of heating.","b":"temperature at which deformation takes place.","c":"presence of carbon in excess of 25% for steels.","d":"presence of silicon in excess of 0.1% for steels."},"answer":"b","section":"III","category":"Ch. 7: Metal Forming","id":445},{"number":21,"question":"In drawing and deep drawing, the final shape often can be completed in a series of draws, each successively deeper. What process performed between draws might effectively reduce the number of draws required?","options":{"a":"Recrystallization","b":"Pickling","c":"Etching","d":"Hardening heat treatment"},"answer":"a","section":"III","category":"Ch. 7: Metal Forming","id":446},{"number":22,"question":"Spinning can be used to form:","options":{"a":"spherical deep-drawn shapes.","b":"cemented carbide cutting tools.","c":"rectangular sheet metal tanks.","d":"solid spheres."},"answer":"a","section":"III","category":"Ch. 7: Metal Forming","id":447},{"number":23,"question":"Deep drawing, blanking, punching, and shearing are operations most commonly applied to:","options":{"a":"castings.","b":"slabs or blooms.","c":"extracted ore.","d":"sheet metal. [7.2.2.3]"},"answer":"d","section":"III","category":"Ch. 7: Metal Forming","id":448,"reference":"[7.3.2]"},{"number":24,"question":"Most new developments in sheet-metal forming typically use nonconventional energy sources. What is a common feature of these processes?","options":{"a":"The use of lasers for controlled heat input.","b":"The use of cryogenics to super-cool the metal prior to forming.","c":"The use of energy sources that release large amounts of energy in a very short time.","d":"The use of large autoclaves that contain both the tooling and the metal being formed."},"answer":"c","section":"III","category":"Ch. 7: Metal Forming","id":449,"reference":"[7.3.4]"},{"number":25,"question":"Chemical catalysts, filter elements, and bearings are commonly made by:","options":{"a":"powder metallurgy.","b":"galvannealing.","c":"vacuum metallization.","d":"hot isostatic pressing."},"answer":"a","section":"III","category":"Ch. 7: Metal Forming","id":450,"reference":"[7.4]"},{"number":26,"question":"Powder metallurgy provides two unique advantages in metals processing. One is the capability to produce shapes and objects of refractory metals that are extremely difficult or impractical to melt; the other is to:","options":{"a":"economically produce metals with extremely low melting temperatures.","b":"produce metal shapes with controlled porosity.","c":"produce metals that can be easily machined by electrochemical processes.","d":"produce metals that are corrosion resistant."},"answer":"b","section":"III","category":"Ch. 7: Metal Forming","id":451,"reference":"[7.4.1]"},{"number":28,"question":"Powder metallurgy sintering:","options":{"a":"is performed above the material’s melting temperature.","b":"allows parts to be hot worked, heat treated, or machined afterward.","c":"results in a maximum of 70% theoretical density.","d":"leaves parts in a fragile state subject to handling damage."},"answer":"b","section":"III","category":"Ch. 7: Metal Forming","id":452,"reference":"[7.4.2]"},{"number":29,"question":"In the powder metallurgy process, sintering is:","options":{"a":"in most cases a fully solid-state process.","b":"never a fully solid-state process.","c":"principally done at room temperature.","d":"always done at elevated temperature and high pressure."},"answer":"a","section":"III","category":"Ch. 7: Metal Forming","id":453,"reference":"[7.4.3]"},{"number":1,"question":"An assembly that has been created by joining two or more parts by one or more welds is called a:","options":{"a":"joint.","b":"bonded structure.","c":"weld.","d":"weldment."},"answer":"d","section":"III","category":"Ch. 8: Joining and Fastening","id":454,"reference":"[8.1]"},{"number":2,"question":"A general definition of welding describes the joining of two surfaces:","options":{"a":"with a filler metal that has a higher melting point than the base metal.","b":"with a filler material that is different from the base material.","c":"in a permanent union established by atom-to-atom bonds.","d":"where both heat and pressure are necessary for permanent bonding."},"answer":"c","section":"III","category":"Ch. 8: Joining and Fastening","id":455,"reference":"[8.1]"},{"number":3,"question":"Melting of faying surfaces, proximity of surfaces, and cleanliness are requirements for:","options":{"a":"soldering.","b":"fastening.","d":"fusion bonding."},"answer":"d","section":"III","category":"Ch. 8: Joining and Fastening","id":456,"reference":"[8.1.2.1]"},{"number":4,"question":"Metallurgical effects in a weld, such as grain size variation and shrinkage, are similar to those that occur in:","options":{"a":"forgings.","b":"castings.","c":"extrusions.","d":"hot-rolled plates."},"answer":"b","section":"III","category":"Ch. 8: Joining and Fastening","id":457,"reference":"[8.1.2.1]"},{"number":5,"question":"Pressure welding can be accomplished with pressure alone, but what else is usually added?","options":{"a":"Heat","b":"Filler material","c":"Oxides","d":"Adhesives"},"answer":"a","section":"III","category":"Ch. 8: Joining and Fastening","id":458,"reference":"[8.1.2.2]"},{"number":6,"question":"In pressure bonding, heat has the effect of:","options":{"a":"increasing malleability.","b":"age hardening.","c":"reducing the grain size.","d":"causing a phase change."},"answer":"a","section":"III","category":"Ch. 8: Joining and Fastening","id":459,"reference":"[8.1.2.2]"},{"number":7,"question":"Soldering, brazing, and braze welding all:","options":{"a":"have the same strength characteristics.","b":"use a process where only the filler metal is actually melted.","c":"are fusion-type weldments.","d":"use a process where both the base metal and filler metal are melted."},"answer":"b","section":"III","category":"Ch. 8: Joining and Fastening","id":460,"reference":"[8.1.2.3]"},{"number":8,"question":"Melting of only the filler material, proximity of surfaces, and cleanliness are requirements for:","options":{"a":"fusion bonding.","b":"brazing.","c":"diffusion bonding.","d":"friction stir welding."},"answer":"b","section":"III","category":"Ch. 8: Joining and Fastening","id":461},{"number":9,"question":"In the process of diffusion welding, often called “diffusion bonding,” the base metal is joined by:","options":{"a":"melting the weld joint area with strip heaters.","b":"using high-temperature adhesives.","c":"putting it under pressure at temperatures below the melting point.","d":"the heat of frictional movement between the surfaces to be joined. Arrow side of joint Arrow of welding symbol Other side of joint Figure 5"},"answer":"c","section":"III","category":"Ch. 8: Joining and Fastening","id":462},{"number":10,"question":"What type of weld joint is depicted in Figure 5?","options":{"a":"Corner joint","b":"Butt joint","c":"Tee joint","d":"Edge joint Figure 6"},"answer":"a","section":"III","category":"Ch. 8: Joining and Fastening","id":463,"figure":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAAF+CAIAAAAjk9tpAAAACXBIWXMAAA7EAAAOxAGVKw4bAABWeklEQVR4nO29h1sU1/u///tPkphEjUZNjN1YAOldOiiKiKCASFERERuIUixYKNJURLGgSBFQASlSRUWKdBCQokaxG8v+Xtnzcb77XmBpy+4OPrfn8jo7zM6cafc8z+zMmf9PQBAEwRP+P3k3gCAIYqiQsAiC4A0kLIIgeAMJiyAI3kDCIgiCN5CwCILgDSQsgiB4AwmLIAjeQMIiCII3kLAIguANJCyCIHgDCYsgCN5AwiIIgjeQsAiC4A0kLIIgeAMJiyAI3kDCIgiCN5CwCILgDSQsgiB4AwmLIAjeQMIiCII3kLAIguANJCyCIHgDCYsgCN5AwiIIgjeQsAiC4A0kLIIgeAMJiyAI3kDCIgiCN5CwCILgDSQsgiB4AwmLIAjeQMIiCII3kLAIguANJCyCIHgDCUshePLkybNnz+Qya8y3t7dXbODnz59bWlrk0h6CkAAJS/68evVqyqRJ6qqqcpm755YtYSdOiA3s7Oz8dcIEubSHICRAwpI/8XFxdra2c2bNun/vnuzn3tHR8ezpU7GBJCxCMSFhyR89HZ2MjIy9u3dv27qVDWltbT0aEtLY0ODj7V1ZWbndy+v58+dBAQFXEhPx19s5Oa4uLmvXrAkPC/v3338xZNfOnRgZlQ8fPiBiqqmuRv3r16/eXl5imWbi5cs2q1attLI6cugQ++6lixezs7NRwcfQEyfwVxdn5+ysLE5YzU1NXp6etjY24aGh7CsEIS9IWHKmuqrqz+nTP378+PDhw99/++3NmzcYeK+8fO in service. What is the principal cause for such cracks?","options":{"a":"Accelerated corrosion at high temperature","b":"Scattered porosity in the weld","c":"Improper selection of base material","d":"Excessive residual stresses"},"answer":"d","section":"III","category":"Ch. 8: Joining and Fastening","id":467,"reference":"[8.2.2]"},{"number":15,"question":"The principal purpose of preheat treatment and postheat treatment in welds is to:","options":{"a":"reduce the probability of formation of porosity in the weld.","b":"neutralize residual stresses and geometric distortion.","c":"create grains in the weld that are the same as those in the base metal.","d":"cause the weld ripple and reinforcement to blend into the base metal."},"answer":"b","section":"III","category":"Ch. 8: Joining and Fastening","id":468,"reference":"[8.2.2]"},{"number":16,"question":"In welding, the most obvious discontinuities are those associated with structural anomalies in the weld itself. Which conditions are welding process discontinuities?","options":{"a":"Part fit-up, laminations, incorrect base metal","b":"Weld dimension, location, distortion","c":"Correct filler metal, corrosion, sequence","d":"Insulation, paint, metallic coatings"},"answer":"b","section":"III","category":"Ch. 8: Joining and Fastening","id":469,"reference":"[8.2.2]"},{"number":17,"question":"Thermal conductivity of a metal is an important factor to consider in making quality weldments because:","options":{"a":"some metals, such as aluminum, have a low conductivity, which results in weld discontinuities due to localized heat buildup.","b":"some metals, such as stainless steel, have a high conductivity, which results in lack of fusion discontinuities as the heat is quickly removed from the weld zone.","c":"in some metals, such as aluminum, very high temperature gradients are produced, causing stresses during cooling.","d":"some metals, such as stainless steel, have low conductivity, which results in weld discontinuities caused by localized overheating."},"answer":"d","section":"III","category":"Ch. 8: Joining and Fastening","id":470,"reference":"[8.2.2]"},{"number":18,"question":"In arc welding, the electric arc is usually sustained between an electrode and the:","options":{"a":"welding machine.","b":"workpiece.","c":"coating on the electrode.","d":"shielding gas."},"answer":"b","section":"III","category":"Ch. 8: Joining and Fastening","id":471,"reference":"[8.2.5]"},{"number":19,"question":"Which of the following gases are most frequently used as shielding to provide an inert atmosphere in the vicinity of the weld?","options":{"a":"Argon, helium, and carbon dioxide","b":"Neon, tritium, and helium","c":"Sulphur dioxide, argon, and oxygen","d":"Argon, nitrogen, and hydrogen"},"answer":"a","section":"III","category":"Ch. 8: Joining and Fastening","id":472,"reference":"[8.2.5; 8.2.5.4]"},{"number":20,"question":"The burn-off rate and amount of spattering during the arc welding process can often be controlled by:","options":{"a":"proper postheating of the entire weldment.","b":"frequent changing of the tungsten electrode.","c":"maintaining the longest arc length possible to reduce the heat in the weld zone.","d":"selecting the proper electrode polarity."},"answer":"d","section":"III","category":"Ch. 8: Joining and Fastening","id":473,"reference":"[8.2.5.1]"},{"number":21,"question":"Due to high temperatures and rapid rate of cooling, the filler material used in fusion welds:","options":{"a":"is coated with an oxide to help reduce weld discontinuities.","b":"contains alloys that will help compensate for properties lost during the welding process.","c":"is alloyed with nickel, copper, and carbon to eliminate cracking.","d":"should be as close as possible to the same alloy content as the base material."},"answer":"b","section":"III","category":"Ch. 8: Joining and Fastening","id":474,"reference":"[8.2.6]"},{"number":22,"question":"When molten metal is transferred from the electrode to the weld zone, which of the following can be used to shield the molten metal from the atmosphere?","options":{"a":"Base metal, filler metal, supplemental powder","b":"Tungsten, solid wire, spray powder","c":"Electrode coating, shielding gas, granular flux","d":"Controlled heat input, clean surfaces, qualified weld procedure"},"answer":"c","section":"III","category":"Ch. 8: Joining and Fastening","id":475},{"number":23,"question":"Which of the following welding processes uses a nonconsumable electrode with the arc maintained in an atmosphere of inert gas?","options":{"a":"Gas tungsten arc welding","b":"Submerged arc welding","c":"Gas metal arc welding","d":"Electroslag welding"},"answer":"a","section":"III","category":"Ch. 8: Joining and Fastening","id":476},{"number":24,"question":"Shielding in the submerged arc welding process is provided by:","options":{"a":"gases.","b":"a flux-coated welding rod.","c":"granular flux that completely surrounds the arc.","d":"chopped glass fibers."},"answer":"c","section":"III","category":"Ch. 8: Joining and Fastening","id":477},{"number":25,"question":"A welding process that is most frequently carried out in a vacuum chamber is:","options":{"a":"plasma arc welding.","b":"electron beam welding.","c":"electroslag welding.","d":"friction welding."},"answer":"b","section":"III","category":"Ch. 8: Joining and Fastening","id":478},{"number":26,"question":"The welding process capable of very high intensity and rate of heat transfer is:","options":{"a":"braze welding.","b":"diffusion welding.","c":"soldering.","d":"plasma arc welding. [8.2.9]"},"answer":"d","section":"III","category":"Ch. 8: Joining and Fastening","id":479,"reference":"[8.2.6]"},{"number":27,"question":"The welding process in which the arc is extinguished after melting a slag cover and in which the base metal and copper slides form a sort of moving mold is called:","options":{"a":"submerged arc welding.","b":"electroslag welding.","c":"electron beam welding.","d":"slag mold weldi  and intermittent","b":"Longitudinal, transverse, and crater","c":"Laminar, through, and oblique","d":"Longitudinal, laminar, and intermittent"},"answer":"b","section":"III","category":"Ch. 8: Joining and Fastening","id":483,"reference":"[8.3.3]"},{"number":31,"question":"A slag inclusion can result from which of the following?","options":{"a":"Small pieces of tungsten being dislodged from the electrode in the gas tungsten arc process","b":"Excessive overlap on intermediate passes in a multipass weldment","c":"Insufficient cleaning of successive passes in a multipass weldment","d":"Contaminants in the welding flux"},"answer":"c","section":"III","category":"Ch. 8: Joining and Fastening","id":484,"reference":"[8.3.3]"},{"number":32,"question":"Undercut on a weld pass is usually caused by:","options":{"a":"poor operator technique.","b":"a rate of travel that is too slow, which causes the base metal to become too hot.","c":"the use of an electrode that is too large for the current capacity of the welding machine.","d":"welding in the vertical position."},"answer":"a","section":"III","category":"Ch. 8: Joining and Fastening","id":485,"reference":"[8.3.3]"},{"number":33,"question":"Crater cracks may take the form of a single crack or star- shaped cracks and will usually be found:","options":{"a":"by magnetic particle techniques since crater cracks are always subsurface.","b":"anywhere along a weld where the welding was stopped and restarted.","c":"in the natural crater formed between the two plates in a typical fillet weld.","d":"in the root area of a multiple-pass weld where the weld metal failed to flow completely into the root opening."},"answer":"b","section":"III","category":"Ch. 8: Joining and Fastening","id":486,"reference":"[8.3.3]"},{"number":34,"question":"Weldments subject to restraint during welding can develop high residual stresses. Unrestrained weldments can develop:","options":{"a":"geometric distortion.","b":"high residual stresses.","c":"cracking after the weld has cooled.","d":"fatigue cracking."},"answer":"a","section":"III","category":"Ch. 8: Joining and Fastening","id":487,"reference":"[8.3.4.1]"},{"number":35,"question":"After welding, many steel weldments are heat treated to obtain more uniform properties between the weld and base metal and to relieve stress. Which heat-treatment method is often used following welding?","options":{"a":"Tempering","b":"Martensitic aging","c":"Normalizing","d":"Spheroidizing"},"answer":"c","section":"III","category":"Ch. 8: Joining and Fastening","id":488,"reference":"[8.3.4.1]"},{"number":36,"question":"When steel has been quench hardened and then reheated to some point below the lower transformation temperature for the purpose of reducing brittleness, this is called:","options":{"a":"austenitization.","b":"thermal slip deformation.","c":"allotropic change.","d":"tempering."},"answer":"d","section":"III","category":"Ch. 8: Joining and Fastening","id":489},{"number":1,"question":"In describing machinability, three different measurements are generally considered on a relative, if not quantitative, basis. These are:","options":{"a":"shear, tensile, and impact strength of the material being machined.","b":"surface finish of the material achievable, power consumption required to remove a given volume of material, and expected tool life.","c":"softness of the material, sharpness of the cutting tool, and type of machine used to remove the material.","d":"volume of material before machining, volume of material after machining, and time required to remove that volume."},"answer":"b","section":"III","category":"Ch. 9: Material Removal Processes","id":490},{"number":2,"question":"Equipment that aids in material removal from a workpiece by establishing a suitable set of motions and maintaining known positions are:","options":{"a":"millworking machines.","b":"factory machines.","c":"machine tools.","d":"metal-cutting machines."},"answer":"c","section":"III","category":"Ch. 9: Material Removal Processes","id":491},{"number":3,"question":"A cutting operation that has the ability to cut through thicknesses of more than 0.9 m (3 ft) of steel and is commonly used to remove surface discontinuities on castings and forgings by “scarfing” is called:","options":{"a":"oxyacetylene cutting.","b":"friction cutting.","c":"ultrasonic cutting.","d":"plasma arc cutting."},"answer":"a","section":"III","category":"Ch. 9: Material Removal Processes","id":492},{"number":4,"question":"The process used for shaping metals by chemical dissolution only, with selective removal accomplished by masking areas where metal is NOT to be removed, is called:","options":{"a":"electrical discharge machining.","b":"chemical milling.","c":"electrochemical machining.","d":"electroforming. [8.3.4.2]"},"answer":"b","section":"III","category":"Ch. 9: Material Removal Processes","id":493,"reference":"[9.4.2]"},{"number":5,"question":"The acronym EDM refers to:","options":{"a":"engineering design materials.","b":"energy discharge machines.","c":"electrodynamic machining.","d":"electrical discharge machining. [9.4.3] Tool feed Tool – DC power supply Pump [9.1.4] Work + Electrolyte Figure 10"},"answer":"d","section":"III","category":"Ch. 9: Material Removal Processes","id":494,"reference":"[9.2.1]"},{"number":6,"question":"Figure 10 illustrates:","options":{"a":"chemical milling.","b":"electrochemical machining.","c":"ultrasonic machining.","d":"electrolytic grinding. [9.4.4] [9.2.2.1] High- frequency amplifier Magnetostrictive transducer Support and feed at node Abrasive slurry Tool Figure 11"},"answer":"b","section":"III","category":"Ch. 9: Material Removal Processes","id":495,"figure":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcgAAAF+CAIAAACJUB3VAAAACXBIWXMAAA7EAAAOxAGVKw4bAABEcElEQVR4nO2diV8M/x/H/Sd83SKKCDlzJJFc5cwZSblyJKJc5ch9FEquUOQqR45ylZQoRUihi5R03+3vbT++89vvVqup2dnZ9vV8fOSzn/nMZz4zu/Pc92dmdqaNTM71a9dWLFu22tl5s5vbLi8vL09P2b9s2rixZ48eM2xs1q1ZU1FRUVdXd/7cObcNG7Zt2ULp169frFpJSQnNSCVU/+S 10: Surface Treatments and Coatings","id":500,"reference":"[10.1]"},{"number":3,"question":"Carburizing and flame hardening are examples of:","options":{"a":"annealing processes.","b":"case-hardening processes.","c":"processes that produce ductile surfaces.","d":"electrochemical processes."},"answer":"b","section":"III","category":"Ch. 10: Surface Treatments and Coatings","id":501,"reference":"[10.2]"},{"number":4,"question":"Which of the following nondestructive tests would provide the best results in measuring the case depth on a case- hardened part?","options":{"a":"Ultrasonic immersion testing using a very low- frequency probe","b":"Radiographic testing","c":"Electromagnetic testing","d":"Magnetic particle testing"},"answer":"c","section":"III","category":"Ch. 10: Surface Treatments and Coatings","id":502,"reference":"[10.2.1]"},{"number":5,"question":"The best and most economical cleaners used for removal of oils and greases are:","options":{"a":"pickling baths.","b":"deionized water sprays.","c":"wire brushes and cloth buffers.","d":"petroleum solvents."},"answer":"d","section":"III","category":"Ch. 10: Surface Treatments and Coatings","id":503,"reference":"[10.3.2]"},{"number":6,"question":"Coatings are often applied to protect a material; their thicknesses can frequently be determined nondestructively by:","options":{"a":"acoustic emission testing.","b":"electromagnetic testing.","c":"surface-wave ultrasonic techniques.","d":"optical holography."},"answer":"b","section":"III","category":"Ch. 10: Surface Treatments and Coatings","id":504},{"number":7,"question":"A process that is the reverse of electrochemical machining and that involves the deposition of metals on other metals or nonmetals is called:","options":{"a":"chemical milling.","b":"electrical discharge machining.","c":"electroplating.","d":"magnetoforming."},"answer":"c","section":"III","category":"Ch. 10: Surface Treatments and Coatings","id":505},{"number":8,"question":"Metals commonly applied to other metals by electroplating are:","options":{"a":"nickel, chromium, and cadmium.","b":"tin, zinc, and tungsten.","c":"silver, gold, and carbon.","d":"copper, aluminum, and magnesium."},"answer":"a","section":"III","category":"Ch. 10: Surface Treatments and Coatings","id":506},{"number":9,"question":"Which coating process causes paint particles to be directly attracted to a substrate to efficiently form an even coating?","options":{"a":"Chemical conversion coating","b":"Electrostatic spraying","c":"Electroplating","d":"Thermal spraying"},"answer":"b","section":"III","category":"Ch. 10: Surface Treatments and Coatings","id":507},{"number":10,"question":"Some materials, such as aluminum, are corrosion resistant:","options":{"a":"by virtue of the immediate oxidation of newly exposed surfaces.","b":"only if anodized.","c":"because the material itself will not readily combine with oxygen.","d":"against all types of corrosive atmospheres."},"answer":"a","section":"III","category":"Ch. 10: Surface Treatments and Coatings","id":508},{"number":11,"question":"A process that converts the base metal surface to an oxidized barrier layer of very small porous cells is called:","options":{"a":"galvanizing.","b":"anodizing.","c":"plating.","d":"metallizing. [10.4.5]"},"answer":"b","section":"III","category":"Ch. 10: Surface Treatments and Coatings","id":509,"reference":"[10.4.2]"},{"number":12,"question":"The anodized surface on aluminum:","options":{"a":"can produce a high background during a penetrant test.","b":"is very dense and makes X-ray penetration difficult.","c":"can produce cracks that are easily detected by electromagnetic testing techniques.","d":"must be removed before performing ultrasonic tests. [10.4.5]"},"answer":"a","section":"III","category":"Ch. 10: Surface Treatments and Coatings","id":510,"reference":"[10.4.2]"},{"number":13,"question":"A corrosion protection material commonly applied to steel by hot dipping and galvanizing is:","options":{"a":"porcelain.","b":"paint.","c":"zinc.","d":"chromic acid. [10.4.6.2]"},"answer":"c","section":"III","category":"Ch. 10: Surface Treatments and Coatings","id":511,"reference":"[10.4.2]"},{"number":1,"question":"Which of the following statements best differentiates a “defect” from a “discontinuity”?","options":{"a":"Discontinuities can propagate and become defects.","b":"All discontinuities are defects.","c":"All defects will lead to failure if undetected; discontinuities are harmless.","d":"Discontinuities are external natural boundaries only; defects are internal flaws originating from errors in processing. [11.1]"},"answer":"a","section":"III","category":"Ch. 11: Introduction to Nondestructive Testing","id":512,"reference":"[10.4.5]"},{"number":2,"question":"NDT is often differentiated from other measurement or inspection techniques in that:","options":{"a":"NDT is a measurement of dimensions, geometry, and appearance.","b":"NDT uses electronic instruments to identify, evaluate, and locate discontinuities.","c":"NDT involves indirect tests related to some other quality or characteristic of the material.","d":"NDT is an inspection tool used to confirm the findings of the many other quality assurance techniques."},"answer":"c","section":"III","category":"Ch. 11: Introduction to Nondestructive Testing","id":513,"reference":"[11.1]"},{"number":3,"question":"Which of the following are a function of NDT?","options":{"a":"Testing product to failure point, product application, and cost reduction","b":"Tensile tests, Charpy tests, and Vickers hardness testing","c":"Identifying material, checking for discontinuities, and testing without destroying the product","d":"Checking dimensions, geometry, and appearance"},"answer":"c","section":"III","category":"Ch. 11: Introduction to Nondestructive Testing","id":514,"reference":"[11.2]"},{"number":4,"question":"A false indication is one formed by a:","options":{"a":"discontinuity larger than accept/reject criteria.","b":"discontinuity smaller than accept/reject criteria.","c":"fatigue crack.","d":"factor unrelated to a discontinuity."},"answer":"d","section":"III","category":"Ch. 11: Introduction to Nondestructive Testing","id":515,"reference":"[11.2]"},{"number":5,"question":"An important basis for the success of NDT design procedures is:","options":{"a":"the need to ensure that unexpected discontinuities of some critical size are not present when the component enters service.","b":"that all discontinuities are detected by NDT or proof testing before the component enters service.","c":"in the use of large factors of safety.","d":"in the use of a value of strength that the material used in the design is presumed to possess."},"answer":"a","section":"III","category":"Ch. 11: Introduction to Nondestructive Testing","id":516,"reference":"[11.2]"},{"number":6,"question":"If properly used, NDT can assist in determining whether a test specimen is functioning as designed by:","options":{"a":"accurately measuring the tensile strength of design materials.","b":"predicting the time it will take a given size discontinuity to grow to a critical size.","c":"determining the corrosion rate.","d":"providing an accurate evaluation of the number and type of discontinuities that exist in a material."},"answer":"d","section":"III","category":"Ch. 11: Introduction to Nondestructive Testing","id":517,"reference":"[11.2]"},{"number":7,"question":"Even at the early stages of product planning, NDT should be considered because:","options":{"a":"codes and specifications are too restrictive.","b":"the design of the part should permit easy access to critical areas for later inspection.","c":"the NDT method may strengthen the product.","d":"the NDT processes are generally more time-intensive than other processes."},"answer":"b","section":"III","category":"Ch. 11: Introduction to Nondestructive Testing","id":518,"reference":"[11.2]"},{"number":8,"question":"Unexpected early fatigue failure can often be prevented by using NDT to:","options":{"a":"verify the cyclic loading on a component.","b":"detect surface discontinuities that could be stress risers.","c":"measure the endurance limit of a part undergoing cyclic stresses.","d":"determine percent elongation of a material before it is placed in service."},"answer":"b","section":"III","category":"Ch. 11: Introduction to Nondestructive Testing","id":519,"reference":"[11.2]"},{"number":9,"question":"What is it called when only a certain percentage of manufactured parts are chosen for inspection?","options":{"a":"Standard deviation","b":"Natural selection","c":"Analysis of variance","d":"Sampling"},"answer":"d","section":"III","category":"Ch. 11: Introduction to Nondestructive Testing","id":520,"reference":"[11.2]"},{"number":10,"question":"Implied in sampling inspection is:","options":{"a":"that the chosen plan will produce precise numbers of acceptable parts.","b":"the need for a sample size of 100 units or multiples thereof.","c":"an understanding that defective products may be present and untested.","d":"the need to collect data in the form of variables instead of attributes."},"answer":"c","section":"III","category":"Ch. 11: Introduction to Nondestructive Testing","id":521},{"number":11,"question":"A vernier line measurement in a visual acuity test permits verification of:","options":{"a":"letter recognition.","b":"trichromatic vision.","c":"code interpretation.","d":"hyperacuity."},"answer":"d","section":"III","category":"Ch. 11: Introduction to Nondestructive Testing","id":522},{"number":12,"question":"Factors of safety are often in the range of 2 to 4. These factors:","options":{"a":"are provided for engineering mistakes.","b":"are added as a corrosion allowance.","c":"could possibly be reduced with the assurance of NDT techniques that the material was free of discontinuities.","d":"provide allowances for poor welding techniques."},"answer":"c","section":"III","category":"Ch. 11: Introduction to Nondestructive Testing","id":523},{"number":1,"question":"In visual testing, which of the following measurement tools uses the principle of light wave interference to check surface flatness?","options":{"a":"Optical comparator","b":"Vernier caliper","c":"Sine bar","d":"Optical flat"},"answer":"d","section":"III","category":"Ch. 12: Nondestructive Testing Methods","id":524,"reference":"[12.1.2.1]"},{"number":2,"question":"Devices that show magnified, reflected, or profile images of the workpiece on a frosted glass screen are called optical:","options":{"a":"comparators.","b":"flats.","c":"projectors.","d":"micrometers. [12.1.2.1]"},"answer":"a","section":"III","category":"Ch. 12: Nondestructive Testing Methods","id":525,"reference":"[11.2]"},{"number":3,"question":"An NDT method that has the ability to measure changes in electrical conductivity caused by the effects of heat treatment is:","options":{"a":"magnetic particle testing.","b":"acoustic emission testing.","c":"electromagnetic testing.","d":"immersion ultrasonic testing. [12.8.1]"},"answer":"c","section":"III","category":"Ch. 12: Nondestructive Testing Methods","id":526,"reference":"[11.3.2]"},{"number":1,"question":"Process control based on the means and ranges of measurements taken on periodic samples requires the measurements to be taken of:","options":{"a":"attributes.","b":"variables or parameters.","c":"either attributes or variables.","d":"neither attributes nor variables. [11.3.3]"},"answer":"b","section":"III","category":"Ch. 13: NDT Applications","id":527,"reference":"[13.1]"},{"number":2,"question":"Monitoring temperature for industrial process control is an example of:","options":{"a":"parameter-based measurement.","b":"geometric dimensioning and tolerancing.","c":"the direct comparison technique.","d":"lateral measurement."},"answer":"a","section":"III","category":"Ch. 13: NDT Applications","id":528,"reference":"[13.1]"},{"number":3,"question":"Metal corrosion that is accelerated when the metal is under load is called:","options":{"a":"pitting corrosion.","b":"galvanic corrosion.","c":"intergranular corrosion.","d":"stress corrosion."},"answer":"d","section":"III","category":"Ch. 13: NDT Applications","id":529,"reference":"[13.4.2]"},{"number":1,"question":"A statement that a particular experiment produced a 0.9 probability of detection with a 95% confidence level means that:","options":{"a":"there is a 90% likelihood that the probability of detection is overstated.","b":"there is a 95% likelihood that the probability of detection is overstated.","c":"on average, 90% of discontinuities will be detected 95% of the time.","d":"on average, 95% of discontinuities will be detected 90% of the time. [14.2] 1.0 90% 0.8 0.6 POD 0.4 0.2 0.0 ANDE 0.002 0.005 0.020 0.050 0.200 Length (in.) Figure 12"},"answer":"c","section":"III","category":"Ch. 14: NDT and Engineering","id":530},{"number":2,"question":"On the probability of detection (POD) curve shown in Figure 12:","options":{"a":"the ANDE line indicates the length of discontinuity that is undetectable in the given test.","b":"the Y axis is set for a 90% confidence level that detectable discontinuities will be detected.","c":"the Y axis is set for a 90% probability level that detectable discontinuities will be detected.","d":"only “hits” are recorded, not “misses.”"},"answer":"c","section":"III","category":"Ch. 14: NDT and Engineering","id":531,"reference":"[14.2]","figure":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcgAAAF+CAIAAACJUB3VAAAACXBIWXMAAA7EAAAOxAGVKw4bAABqpElEQVR4nOydh38Uxf//f/+Jn49CpBdBQPNReu+IoiIoKk1ApCiKoCDSRcU0EhJCSCGN9E4SQhIIkF4uPbn0kF5Jh/u9uPmyLlf2djeXSy68X4993GN3Znb2vTOzz33P7N7s/1OZXBvWrYuKjNQIzM/Le3PMGG4zMCBg/dq1wvkoFIo1K1dieWfWrPctLdm6wDJl4sRlS5YYTCZyWb506Yply2TsuGrFiqWLF4tMPN7CwmAa5IY89cUuWbRIUpQk88SbIWAJihGFKSb9wvnzZ0yfPsiKE1k4wsvK5ctFtqUlCxdOnzJlkJboi9VX5jprcNL48QbNQF0ItGpmxvo1azd9+OGWz7Zs+2Lbjh07d+/+Zu/efXv27tu//wCW7w4cPHjoMLccOvzDD0d+/PSTT6Rasmj+fOOjx4T6f6Y/pE6wZqSnA3zcZlhoKC42kRna2doCxAaTffnFF9VVVeLtFFZ9fUNLS6uMHXt7+8rKykUmxtVrMA1yQ576Yg ||'{}');S.answers=S.answers||{};S.bookmarks=S.bookmarks||{};let session=null;const app=document.getElementById('app');
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function answeredCount(){return Object.keys(S.answers).length}function correctCount(){return Object.values(S.answers).filter(x=>x.correct).length}function accuracy(){let n=answeredCount();return n?Math.round(correctCount()/n*100):0}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function tab(n){document.querySelectorAll('.navbar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===n))}function sectionName(s){return s==='I'?'Qualification & Certification':s==='II'?'NDT Methods':'Materials & Processes'}function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function groups(){let m={};Q.forEach(q=>{let k='Section '+q.section+' — '+q.category;(m[k]??=[]).push(q)});return m}
function showCategories(){tab('categories');let g=groups(),h=`<div class="card"><h2 style="margin-top:0">Study by Topic</h2>`;for(const[k,qs]of Object.entries(g)){let a=qs.filter(q=>S.answers[q.id]).length;h+=`<div class="category"><div><div class="name">${esc(k)}</div><div class="small">${a} / ${qs.length} attempted</div></div><button onclick='startIds(${JSON.stringify(qs.map(q=>q.id))})'>Study</button></div>`}app.innerHTML=h+'</div>'}
function startIds(ids,limit=null){let qs=ids.map(id=>Q.find(q=>q.id===id)).filter(Boolean);if(limit)qs=shuffled(qs).slice(0,limit);session={qs,index:0,score:0,answered:false};renderQ()}function startRandom(n){startIds(Q.map(q=>q.id),n)}function startMock(){let ids=[];['I','II','III'].forEach(s=>ids.push(...shuffled(Q.filter(q=>q.section===s)).slice(0,45).map(q=>q.id)));startIds(shuffled(ids))}
function startWrongReview(){tab('review');let ids=Object.entries(S.answers).filter(([id,v])=>!v.correct).map(([id])=>+id);if(!ids.length){app.innerHTML='<div class="card center"><h2>No missed questions yet</h2><p class="small">Questions you answer incorrectly will appear here.</p><button onclick="startRandom(10)">Start a quiz</button></div>';return}startIds(ids)}function startBookmarks(){let ids=Object.keys(S.bookmarks).map(Number);if(!ids.length){app.innerHTML='<div class="card center"><h2>No bookmarks yet</h2><p class="small">Bookmark difficult questions while studying.</p></div>';return}startIds(ids)}
function renderQ(){if(!session||session.index>=session.qs.length)return finishSession();let q=session.qs[session.index],pct=Math.round(session.index/session.qs.length*100);app.innerHTML=`<div class="card"><div class="qmeta"><span>${esc(sectionName(q.section))} • ${esc(q.category)}</span><span>${session.index+1} / ${session.qs.length}</span></div><div class="progressbar"><i style="width:${pct}%"></i></div><div class="question">${esc(q.question)}</div>${q.figure?`<img class="figure" src="${q.figure}" alt="Figure referenced in question">`:''}<div>${Object.entries(q.options).map(([k,v])=>`<button class="option" data-k="${k}" onclick="choose('${k}')"><b>${k.toUpperCase()}.</b> ${esc(v)}</button>`).join('')}</div><div id="feedback"></div><div class="actions" style="margin-top:14px"><button class="ghost" onclick="toggleBookmark(${q.id})">${S.bookmarks[q.id]?'★ Bookmarked':'☆ Bookmark'}</button><button class="secondary" onclick="nextQ()">Skip</button></div>${q.reference?`<div class="small" style="margin-top:10px">Guide reference: ${esc(q.reference)}</div>`:''}</div>`}
function choose(k){if(!session||session.answered)return;let q=session.qs[session.index];session.answered=true;let good=k===q.answer;if(good)session.score++;S.answers[q.id]={correct:good,lastSelected:k,at:Date.now()};save();document.querySelectorAll('.option').forEach(b=>{let x=b.dataset.k;if(x===q.answer)b.classList.add('correct');if(x===k&&x!==q.answer)b.classList.add('wrong');b.disabled=true});document.getElementById('feedback').innerHTML=`<div class="feedback"><b class="${good?'goodtext':'badtext'}">${good?'Correct':'Incorrect'}</b><div style="margin-top:5px">Answer: <b>${q.answer.toUpperCase()}</b> — ${esc(q.options[q.answer])}</div></div><div style="margin-top:12px"><button onclick="nextQ()">Next Question</button></div>`}
function nextQ(){if(!session)return;session.index++;session.answered=false;renderQ()}function toggleBookmark(id){if(S.bookmarks[id])delete S.bookmarks[id];else S.bookmarks[id]=true;save();renderQ()}function finishSession(){let n=session?session.qs.length:0,sc=session?session.score:0,pct=n?Math.round(sc/n*100):0;session=null;app.innerHTML=`<div class="card center"><h2>Session Complete</h2><div style="font-size:48px;font-weight:800">${pct}%</div><p>${sc} correct out of ${n}</p><div class="actions" style="justify-content:center"><button onclick="showHome()">Home</button><button class="secondary" onclick="startWrongReview()">Review Missed</button></div></div>`}
function showSearch(){tab('search');app.innerHTML=`<div class="card"><h2 style="margin-top:0">Search Questions</h2><input id="searchbox" placeholder="e.g. written practice, ultrasonic, casting" oninput="doSearch(this.value)"><div id="results" class="small">Type a term to search the full review bank.</div></div>`}function doSearch(v){let box=document.getElementById('results');v=v.trim().toLowerCase();if(v.length<2){box.innerHTML='Type at least 2 characters.';return}let hits=Q.filter(q=>(q.question+' '+Object.values(q.options).join(' ')+' '+q.category).toLowerCase().includes(v)).slice(0,80);box.innerHTML=hits.map(q=>`<div class="search-result"><b>${esc(q.question)}</b><div class="small">${esc(q.category)}</div><button style="margin-top:7px;padding:7px 10px" onclick="startIds([${q.id}])">Open</button></div>`).join('')||'No matches.'}
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  const b=document.getElementById('installBtn');

});

  deferredInstallPrompt=null;
});
async function installApp(){
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  const b=document.getElementById('installBtn');
  if(b)b.style.display='none';
}
